<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>.country-detail .temp-legend{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px 6px;
  margin:12px 0;
}.country-detail .temp-tile{
  display:flex;
  align-items:stretch;
  gap:6px;
  min-width:0;
  padding:0;
  background:transparent;
  color:#111;
  border:none;
  border-radius:0;
}.country-detail .temp-swatch{
  width:3px;
  flex:0 0 3px;
  align-self:stretch;
  border-radius:2px;
  display:block;
}.country-detail .temp-tile-body{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:flex-start;
  gap:2px;
  min-width:0;
  flex:1 1 auto;
}.country-detail .temp-tile-name{
  font-weight:650;
  font-size:.8rem;
  line-height:1.2;
}.country-detail .temp-tile-name{font-size:.74rem}.country-detail .temp-tile-value{
  margin:0;
  font-size:.95rem;
  font-weight:750;
  font-variant-numeric:tabular-nums;
  line-height:1.15;
  overflow-wrap:anywhere;
}.country-detail .temp-tile-value{font-size:.88rem}@media (max-width:359px){
  .country-detail .temp-tile-name{font-size:.74rem} body{margin:0;padding:8px;background:#f7f6f3}</style></head><body class="country-detail"><div class="temp-legend" data-temp-legend><div class="temp-tile" data-series="aggregate"><i class="temp-swatch" style="background:#1687FF"></i><div class="temp-tile-body"><span class="temp-tile-name">Aggregate</span><b class="temp-tile-value">52.80</b></div></div><div class="temp-tile" data-series="inflation"><i class="temp-swatch" style="background:#12BF4A"></i><div class="temp-tile-body"><span class="temp-tile-name">Inflation</span><b class="temp-tile-value">51.00</b></div></div><div class="temp-tile" data-series="labor"><i class="temp-swatch" style="background:#FFD13D"></i><div class="temp-tile-body"><span class="temp-tile-name">Labor</span><b class="temp-tile-value">55.00</b></div></div><div class="temp-tile" data-series="activity"><i class="temp-swatch" style="background:#FF7626"></i><div class="temp-tile-body"><span class="temp-tile-name">Activity</span><b class="temp-tile-value">50.00</b></div></div><div class="temp-tile" data-series="consumer"><i class="temp-swatch" style="background:#CBAAF5"></i><div class="temp-tile-body"><span class="temp-tile-name">Consumer</span><b class="temp-tile-value">54.00</b></div></div></div></body></html>
