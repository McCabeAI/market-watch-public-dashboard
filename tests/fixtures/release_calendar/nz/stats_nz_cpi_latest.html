.5,23.7,23.7,24.1,28.2\r\n&quot;}],&quot;GraphType&quot;:&quot;columnStacked&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Percentage distribution of price changes for CPI items, September 2018\u2013September 2026&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot; &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;135647&quot;,&quot;Title&quot;:&quot;Consumers price index: September 2026 quarter \u2013 key facts 5&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Tradeable and non-tradeable inflation&lt;\/h2&gt;\n&lt;p&gt;Tradeable inflation measures final goods and services that are influenced by foreign markets.&lt;\/p&gt;\n&lt;p&gt;Within the 4.3 percent increase in tradeable inflation in the 12 months to the September 2026 quarter, higher prices were recorded for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;petrol, up 19.1 percent (36.6 percent contribution to the 4.3 percent rise for all groups tradeable)&lt;\/li&gt;\n&lt;li&gt;international air transport, up 12.5 percent (12.6 percent contribution to all groups tradeable).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Lower\u202fprices\u202fwere recorded\u202ffor:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;oils and fats, down 8.3 percent (-1.8 percent contribution to all groups tradeable)&lt;\/li&gt;\n&lt;li&gt;vegetables, down 2.2 percent (-1.7 percent contribution to all groups tradeable).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Non-tradeable inflation measures final goods and services that do not face foreign competition and is an indicator of domestic demand and supply conditions. However, the inputs of these goods and services can be influenced by foreign competition.&lt;\/p&gt;\n&lt;p&gt;Within the 3.3 percent increase in non-tradeable inflation in the 12 months to the September 2026 quarter, higher prices were recorded for:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;purchase of housing, up 3.2 percent (15.0 percent contribution to the 3.3 percent rise for all groups non-tradeable)&lt;\/li&gt;\n&lt;li&gt;electricity, up 9.3 percent (13.7 percent contribution to all groups non-tradeable).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Lower\u202fprices\u202fwere recorded\u202ffor:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;milk, cheese, and eggs, down 14.7 percent (-2.8 percent contribution to all groups non-tradeable)&lt;\/li&gt;\n&lt;li&gt;other miscellaneous services (driven by auction services), down 5.9 percent (-1.0 percent contribution to all groups non-tradeable).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Note: Eggs is the only non-tradeable item in the milk, cheese, and eggs class.&lt;\/p&gt;\n&lt;h2&gt;Annual inflation, international comparisons&lt;\/h2&gt;\n&lt;table class=\&quot;stats-striped\&quot; style=\&quot;border-collapse: collapse; width: 100%; white-space: normal; margin-bottom: 1.474rem;\&quot; cellspacing=\&quot;0\&quot; cellpadding=\&quot;0\&quot; width=\&quot;595\&quot;&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;199\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Country&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;141\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;12-month inflation rate&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;255\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;Time reference&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;199\&quot;&gt;\n&lt;p&gt;New Zealand&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;141\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;3.7&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;255\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;September 2026&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;199\&quot;&gt;\n&lt;p&gt;Australia&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;141\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;4.0*&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;255\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;August 2026&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;199\&quot;&gt;\n&lt;p&gt;United Kingdom&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;141\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;3.1**&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;255\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;August 2026&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;199\&quot;&gt;\n&lt;p&gt;United States of America&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;141\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;3.7&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;255\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;September 2026&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;199\&quot;&gt;\n&lt;p&gt;OECD average&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;141\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;4.3&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;255\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;August 2026&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;199\&quot;&gt;\n&lt;p&gt;European Union&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;141\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;3.2&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;255\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;August 2026&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td colspan=\&quot;3\&quot; width=\&quot;595\&quot;&gt;\n&lt;p&gt;* Australia\u2019s inflation rate is taken from the Australian Bureau of Statistics (ABS) monthly &lt;a href=\&quot;https:\/\/www.abs.gov.au\/statistics\/economy\/price-indexes-and-inflation\/consumer-price-index-australia\/latest-release\&quot;&gt;Consumer Price Index&lt;\/a&gt; release.&lt;\/p&gt;\n&lt;p&gt;** The United Kingdom\u2019s CPI figure is not their headline figure, which is \u2018Consumer Prices Index including owner occupiers\u2019 housing costs (CPIH)\u2019.&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;\/tbody&gt;\n&lt;\/table&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/data.oecd.org\/price\/inflation-cpi.htm\&quot;&gt;OECD Inflation&lt;\/a&gt; has more data on international inflation rates.&lt;\/p&gt;\n&lt;h2&gt;Information on water rates and local authority rates&lt;\/h2&gt;\n&lt;p&gt;Since 1 July 2026, Tiaki Wai (serving Porirua, the Hutt Valley, and Wellington), IAWAI (serving Hamilton and Waikato), and Selwyn Water Limited (serving Selwyn) have separated water service charges from council rates. Following these changes, we now collect water service charges directly from these entities.&lt;\/p&gt;\n&lt;p&gt;To align with the expenditure classification and weights used in the current CPI, these water service charges have been added back into the local authority rates item. This reflects the 2024 CPI reweighting, which treated council rates in these regions as inclusive of these services.&lt;\/p&gt;\n&lt;p&gt;As a result, the local authority rates class remains comparable with previous periods, as the class continues to represent these separated water service charges despite the new water service entities now directly providing us their charges.&lt;\/p&gt;\n&lt;p&gt;Metered water charges are still included in the water rates item, consistent with their historical treatment. This approach is unchanged, as the water supply component of the CPI weighting is based on metered water charges rather than the newly separated water service entities.&lt;\/p&gt;\n&lt;p&gt;Property rates and related services is the aggregated CPI subgroup that includes local authority rates, water supply, and refuse disposal and recycling services.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;673&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 more data&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;More data&lt;\/h2&gt;&lt;p&gt;Use&amp;nbsp;&lt;a href=\&quot;http:\/\/infoshare.stats.govt.nz\/\&quot;&gt;Infoshare&lt;\/a&gt;&amp;nbsp;t&lt;span style=\&quot;font-size: 1rem;\&quot;&gt;o access the CPI time series:&lt;\/span&gt;&lt;\/p&gt;&lt;p&gt;Subject category:&amp;nbsp;Economic indicators&lt;br&gt;Group:&amp;nbsp;Consumers price index&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;670&quot;,&quot;Title&quot;:&quot;Consumers price index \u2013 metadata&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Definitions and metadata&lt;\/h2&gt;\n&lt;p&gt;&lt;a title=\&quot;Link to DataInfo+. \&quot; href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/item\/nz.govt.stats\/65543d91-a280-4739-b90f-c49cbb7da68c\/#\/nz.govt.stats\/24daf577-e941-4a5c-9ba1-f43c5afb5e1e\/1\&quot;&gt;Consumers price index concepts \u2013 DataInfo+&lt;\/a&gt;&amp;nbsp;gives definitions of terms used in this release and&amp;nbsp;general methodology used to produce&amp;nbsp;the CPI&amp;nbsp;and related metadata.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;http:\/\/datainfoplus.stats.govt.nz\/Item\/nz.govt.stats\/8b0860b8-cf63-4f12-a578-8eed8ba69ac3\/?_ga=2.200485870.1749673349.1620332052-1586433161.1610308723\&quot;&gt;Consumers price index \u2013 DataInfo+&lt;\/a&gt; gives general methodology used to produce the CPI and related metadata.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;133962&quot;,&quot;Title&quot;:&quot;Infoshare is being replaced by Aotearoa Data Explorer&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Infoshare is being replaced by Aotearoa Data Explorer&lt;\/h2&gt;\n&lt;p&gt;&lt;a id=\&quot;menurj4r\&quot; title=\&quot;https:\/\/www.stats.govt.nz\/tools\/info
