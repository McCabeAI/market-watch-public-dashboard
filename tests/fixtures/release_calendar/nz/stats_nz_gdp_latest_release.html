d for price inflation) unless otherwise stated.&lt;\/p&gt;\n&lt;p&gt;In the June 2026 quarter, compared with the March 2026 quarter:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;GDP rose 0.2 percent&lt;\/li&gt;\n&lt;li&gt;expenditure on GDP rose 0.4 percent&lt;\/li&gt;\n&lt;li&gt;GDP per capita rose 0.1 percent&lt;\/li&gt;\n&lt;li&gt;real gross national disposable income fell 0.4 percent.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;The following movements are in seasonally adjusted nominal terms (not adjusted for price inflation).&lt;\/p&gt;\n&lt;p&gt;In the June 2026 quarter, compared with the March 2026 quarter:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;expenditure on GDP rose 0.5 percent&lt;\/li&gt;\n&lt;li&gt;income GDP rose 0.6 percent.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;h2&gt;New Zealand economy up in June 2026 quarter&lt;\/h2&gt;\n&lt;p&gt;Economic activity rose 0.2 percent in the June 2026 quarter as measured by gross domestic product. This follows a 0.9 percent rise in the March 2026 quarter. GDP rose 1.7 percent over the year ended June 2026, compared with the year ended June 2025.&lt;\/p&gt;\n&lt;p&gt;Expenditure on GDP rose 0.4 percent in the June 2026 quarter, following a 1.1 percent rise in the March 2026 quarter. Expenditure on GDP rose 2.2 percent over the year ended June 2026, compared with the year ended June 2025.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;135124&quot;,&quot;Title&quot;:&quot;GDP June 2026 qtr \u2013 g1 \u2013 Gross domestic product, quarterly and annual growth rates, chain volume, December 2022\u2013June 2026&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Quarter&quot;,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:35784,&quot;Title&quot;:&quot;Quarterly growth&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;G &lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;109\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;-0.5&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;196\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;2.4&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;188\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;Exports of goods and services&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;127\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;2.2&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;109\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;3.3&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;196\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;6.1&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;188\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;(Less) imports of goods and services&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;127\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;3.3&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;109\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;-0.8&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;196\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;6.8&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;188\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Expenditure on gross domestic product&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;127\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;1.1&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;109\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;0.4&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;196\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;2.2&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td colspan=\&quot;4\&quot; width=\&quot;620\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Note:&lt;\/strong&gt; For the June 2026 quarter, the measures of average annual growth compare activity over the most recent year (sum of activity in September 2025 to June 2026 quarters) with activity over the previous year (sum of activity in September 2024 to June 2025 quarters).&lt;br&gt;&lt;br&gt;YE \u2013 year ended&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;\/tbody&gt;\n&lt;\/table&gt;&quot;},{&quot;ID&quot;:&quot;135126&quot;,&quot;Title&quot;:&quot;GDP June 2026 qtr \u2013 g6 \u2013 Contribution to change in expenditure on GDP (%), by component, March 2026-June 2026 quarters&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Component&quot;,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:35790,&quot;Title&quot;:&quot;Contribution to change in expenditure on GDP (%), by component, March 2026\u2013June 2026 quarters&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;bar&quot;,&quot;GraphCsvData&quot;:&quot;\&quot;Component\&quot;,\&quot;Exports of goods and services\&quot;,\&quot;Gross fixed capital formation, residential buildings\&quot;,\&quot;Imports of goods and services\&quot;,\&quot;Gross fixed capital formation, business investment\&quot;,\&quot;Private final consumption expenditure\&quot;,\&quot;General government final consumption expenditure\&quot;\n\&quot;Percent\&quot;,0.85,0.28,0.23,0.05,0.02,-0.38\n&quot;}],&quot;GraphType&quot;:&quot;bar&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Contribution to change in expenditure on GDP (%), by component, March 2026\u2013June 2026 quarters&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot;Seasonally adjusted chain volume series in 2009\/2010 prices.&quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;135173&quot;,&quot;Title&quot;:&quot;Gross domestic product: June 2026 quarter \u2013 key facts 5&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Upwards drivers \u2013 change in expenditure&lt;\/h3&gt;\n&lt;p&gt;Exports of goods and services was up 3.3 percent, driven by:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;meat products&lt;\/li&gt;\n&lt;li&gt;other food, beverages, and tobacco&lt;\/li&gt;\n&lt;li&gt;dairy products.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Gross fixed capital formation was up 1.5 percent, driven by:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;residential buildings&lt;\/li&gt;\n&lt;li&gt;intangible fixed assets&lt;\/li&gt;\n&lt;li&gt;plant, machinery, and equipment.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Imports of goods and services was down 0.8 percent (a fall in imports has an upwards contribution to expenditure on GDP), driven by:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;travel services&lt;\/li&gt;\n&lt;li&gt;imports of intermediate goods.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;h3&gt;Downwards drivers \u2013 change in expenditure&lt;\/h3&gt;\n&lt;p&gt;Change in inventories decreased by $289 million, driven by:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;distribution&lt;\/li&gt;\n&lt;li&gt;manufacturing.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Central government final consumption expenditure was down 2.0 percent, driven by:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;intermediate consumption plus taxes on production&lt;\/li&gt;\n&lt;li&gt;social benefits in kind&lt;\/li&gt;\n&lt;li&gt;an increase in sales (an increase in sales has a downwards contribution to the overall movement).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;h2&gt;New Zealand\u2019s real purchasing power falls in the June 2026 quarter&lt;\/h2&gt;\n&lt;p&gt;In the June 2026 quarter, compared with the March 2026 quarter:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;real gross national disposable income fell 0.4 percent&lt;\/li&gt;\n&lt;li&gt;real gross national disposable income per capita fell 0.6 percent.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;In the year ended June 2026, compared with the year ended June 2025:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;annual real gross national disposable income rose 2.5 percent&lt;\/li&gt;\n&lt;li&gt;annual real gross national disposable income per capita rose 1.9 percent.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;While GDP measures economic activity, real gross national disposable income (RGNDI) measures the volumes of goods and services that New Zealand residents have command over, that is, the real purchasing power of the country\u2019s disposable income. RGNDI is also affected by changes in the terms of trade, the country\u2019s net investment income, and net transfer flows with the rest of the world.&lt;\/p&gt;\n&lt;p&gt;New Zealand\u2019s ability to buy goods and services from its income, RGNDI, fell 0.4 percent in the June 2026 quarter. Net transfer flows increased, terms of trade decreased, and net investment income on our international investments increased.&lt;\/p&gt;\n&lt;p&gt;Over the June 2026 quarter, export prices rose 3.5 percent, while import prices rose 13.8 percent, resulting in a decrease in the terms of trade. A decrease in the terms of trade results in more exports being needed to pay for a given volume of imports. This means that residents can purchase fewer goods and services by volume from the income generated from a given level of domestic production.&lt;\/p&gt;\n&lt;p&gt;The 0.4 percent decrease in RGNDI, coupled with a population increase of 0.2 percent over the quarter, decreased RGNDI per capita by 0.6 percent in the quarter.&lt;\/p&gt;\n&lt;p&gt;Annually, RGNDI rose 2.5 percent over the year to June 2026 while RGNDI per capita rose 1.9 percent over the year.&lt;\/p&gt;\n&lt;h2&gt;New Zealand and trade partners, June 2026 quarter&lt;\/h2&gt;\n&lt;table class=\&quot;stats-striped\&quot; style=\&quot;border-collapse: collapse; width: 100%; white-space: normal; margin-bottom: 1.474rem;\&quot; cellspacing=\&quot;0\&quot; cellpadding=\&quot;0\&quot;&gt;&lt;caption&gt;&lt;strong&gt;Table 3, Percentage changes in GDP, international comparisons in chain volume terms, June 2026 quarter and with same quarter previous year (June 2025 quarter)&lt;\/strong&gt;&lt;\/caption&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;143\&quot; valign=\&quot;bottom\&quot;&gt;\n&lt;p&gt;Country&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;248\&quot; valign=\&quot;bottom\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;Quarterly % change in GDP, June 2026 quarter&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;209\&quot; valign=\&quot;bottom\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;% change from same quarter previous year&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;143\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;New Zealand&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;248\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;0.2&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;209\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;2.6&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;143\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;Australia&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;248\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;0.4&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;209\&quot; valign=\&quot;t gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;143\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;OECD \u2013 total&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;248\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;0.5&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;209\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;2.3&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;143\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;United Kingdom&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;248\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;0.4&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;209\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;1.2&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;143\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;United States&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;248\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;0.4&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;209\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;2.1&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td colspan=\&quot;3\&quot; width=\&quot;600\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;Data as at 15 September 2026. See &lt;a href=\&quot;https:\/\/stats.oecd.org\/\&quot;&gt;OECD.Stat&lt;\/a&gt; for GDP data covering other countries. Take care when comparing New Zealand\u2019s GDP figures with those of other countries, as the methodology used varies internationally. Stats NZ publishes both \u2018average annual growth\u2019 and \u2018year-on-year\u2019 (change from same quarter previous year) GDP growth rates. \u2018Average annual growth\u2019 is Stats NZ\u2019s preferred measure, but it is not available from the OECD website for all countries each quarter.&lt;br&gt;&lt;br&gt;For more information on average annual growth and year-on-year growth, see &lt;a href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/Item\/nz.govt.stats\/9a9295f6-ce5f-4c71-8462-ba6dd01f4dc7?&amp;amp;_ga=2.40369250.1392587584.1663017663-1796918034.1635296758#\/nz.govt.stats\/771b4b3c-fc19-4e78-a0e8-cbc63509b36b\&quot;&gt;DataInfo+&lt;\/a&gt;.&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;\/tbody&gt;\n&lt;\/table&gt;\n&lt;h2&gt;Quarterly nominal expenditure GDP, June 2026 quarter&lt;\/h2&gt;\n&lt;p&gt;The following movements are in seasonally adjusted nominal terms (not adjusted for price inflation) unless otherwise stated.&lt;\/p&gt;\n&lt;p&gt;Seasonally adjusted nominal expenditure GDP rose 0.5 percent in the June 2026 quarter. The size of the economy was $455 billion for the year ended June 2026.&lt;\/p&gt;\n&lt;h2&gt;Nominal income GDP rises&lt;\/h2&gt;\n&lt;p&gt;Nominal income GDP rose 0.6 percent in the June 2026 quarter, following a 1.8 percent rise in the March 2026 quarter. The drivers were:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;compensation of employees, up 1.0 percent&lt;\/li&gt;\n&lt;li&gt;taxes on production and imports, up 1.2 percent.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;h2&gt;Breakdown of GDP by income&lt;\/h2&gt;\n&lt;table class=\&quot;stats-striped\&quot; style=\&quot;border-collapse: collapse; width: 100%; white-space: normal; margin-bottom: 1.474rem;\&quot; cellspacing=\&quot;0\&quot; cellpadding=\&quot;0\&quot;&gt;&lt;caption&gt;&lt;strong&gt;Table 4, Quarterly and annual average percentage change in GDP, by income in nominal terms, March 2026 and June 2026 quarters&lt;\/strong&gt;&lt;\/caption&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;177\&quot; valign=\&quot;bottom\&quot;&gt;&amp;nbsp;&lt;\/td&gt;\n&lt;td width=\&quot;125\&quot; valign=\&quot;bottom\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;March 2026 quarter (updated)&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;106\&quot; valign=\&quot;bottom\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;June 2026 quarter&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;192\&quot; valign=\&quot;bottom\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;Annual average (growth over YE June 2026)&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;177\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;Compensation of employees&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;125\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;1.3&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;106\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;1.0&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;192\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;2.7&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;177\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;Gross operating surplus and gross mixed income&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;125\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;1.9&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;106\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;0.0&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;192\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;7.4&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;177\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;Taxes on production and imports&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;125\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;2.8&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;106\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;1.2&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;192\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;5.0&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;177\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;Less subsidies&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;125\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;1.0&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;106\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;-5.5&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;192\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;-11.1&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;177\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Income gross domestic product&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;125\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;1.8&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;106\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;0.6&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;192\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;5.1&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td colspan=\&quot;4\&quot; width=\&quot;600\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Note:&lt;\/strong&gt; For June 2026 quarter, the measures of average annual growth compare activity over the most recent year (sum of activity in September 2025 to June 2026 quarters) with activity over the previous year (sum of activity in September 2024 to June 2025 quarters).&lt;br&gt;&lt;br&gt;YE \u2013 year ended&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;\/tbody&gt;\n&lt;\/table&gt;&quot;},{&quot;ID&quot;:&quot;135125&quot;,&quot;Title&quot;:&quot;GDP June 2026 qtr \u2013 g7 \u2013 Change in income GDP ($), by component, March 2026\u2013June 2026 quarters&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Component&quot;,&quot;yAxisTitle&quot;:&quot;$&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:35791,&quot;Title&quot;:&quot;Change in income GDP ($), by component, March 2026\u2013June 2026 quarters&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;bar&quot;,&quot;GraphCsvData&quot;:&quot;\&quot;Component\&quot;,\&quot;Compensation of employees\&quot;,\&quot;Taxes on production and imports\&quot;,\&quot;Gross operating surplus and gross mixed income\&quot;,\&quot;(Less) subsidies\&quot;\n\&quot;Change ($)\&quot;,508000000,175000000,-6000000,-28000000\n&quot;}],&quot;GraphType&quot;:&quot;bar&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Change in income GDP ($), by component, March 2026\u2013June 2026 quarters&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot;Seasonally adjusted current price series.&quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;135174&quot;,&quot;Title&quot;:&quot;Gross domestic product: June 2026 quarter \u2013 key facts 6&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Impact of conflict in the Middle East on GDP in the June 2026 quarter&lt;\/h2&gt;\n&lt;p&gt;The measures of GDP in the June 2026 quarter were impacted by the Middle East conflict and related fuel price increases. Our headline measure of GDP is presented in volume terms, which removes the effect of price changes. However, GDP for some industries related to fuel saw changes which could be attributed to the large increases in fuel prices during the quarter.&lt;\/p&gt;\n&lt;p&gt;In retail trade and accommodation, fuel retailing fell in volume terms in the June 2026 quarter and was the largest quarterly decline since the COVID-19-affected September 2021 quarter.&lt;\/p&gt;\n&lt;p&gt;Accommodation and food services fell 3.8 percent in the June 2026 quarter, indicating a potential change in discretionary spending.&lt;\/p&gt;\n&lt;p&gt;In household consumption expenditure (HCE), the restaurants and hotels group fell in the June 2026 quarter, indicating a similar change in discretionary spending to that seen in the accommodation and food services sub-industry on the production side.&lt;\/p&gt;\n&lt;p&gt;Transport, postal, and warehousing fell 1.7 percent in the June 2026 quarter, driven by a decline in road transport. The quarterly method for this sub-industry has used diesel delivery volumes since the March 2022 quarter.&lt;\/p&gt;\n&lt;p&gt;The transport group of HCE fell 1.6 percent in the June 2026 quarter. The petrol and other vehicle fuels and lubricants components of non-durable goods HCE also fell during the June 2026 quarter.&lt;\/p&gt;\n&lt;p&gt;Imports of refined petroleum in constant prices rose 5.3 percent in the June 2026 quarter compared with the March 2026 quarter, but rose 63.8 percent in current prices over the same period.&lt;\/p&gt;\n&lt;p&gt;Imports of intermediate goods, processed fuels and lubricants (which includes diesel) in constant prices rose 19.8 percent in the June 2026 quarter compared with the March 2026 quarter, but rose 123.8 percent in current prices over the same period.&lt;\/p&gt;\n&lt;p&gt;Increases in quarterly prices for petrol imports were the highest since December 1990, while increases for processed fuels and lubricants were the highest on record (data from September 1990).&lt;\/p&gt;\n&lt;p&gt;We made no methodological changes to quarterly GDP in response to the Middle East conflict and elevated fuel prices.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;44&quot;,&quot;Title&quot;:&quot;Gross domestic product GDP \u2013 more data&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;More data&lt;\/h2&gt;&lt;p&gt;Use&amp;nbsp;&lt;a title=\&quot;Link to Stats NZ data tool Infoshare\&quot; href=\&quot;http:\/\/infoshare.stats.govt.nz\/\&quot;&gt;Infoshare&lt;\/a&gt;&amp;nbsp;to access the national accounts&amp;nbsp;time series.&lt;\/p&gt;&lt;p&gt;Subject category: Economic indicators &lt;br&gt;Group: National accounts \u2013 SNA 2008&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;135175&quot;,&quot;Title&quot;:&quot;Gross domestic product: June 2026 quarter \u2013 metadata&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Definitions and metadata&lt;\/h2&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/Item\/nz.govt.stats\/9a9295f6-ce5f-4c71-8462-ba6dd01f4dc7?_ga=2.225172954.1957942343.1600037239-940604984.1576371829\&quot;&gt;National accounts quarterlies \u2013 DataInfo+&lt;\/a&gt; provides the general methodology used to produce these statistics.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/item\/nz.govt.stats\/b8a36978-cd7d-4beb-acb9-699524dcf5bb\/4\&quot;&gt;National accounts quarterlies \u2013 concepts \u2013 DataInfo+&lt;\/a&gt; provides the definitions of terms used in this release.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/item\/nz.govt.stats\/5e99e77b-056e-4956-b8be-10a0cf3253b4\&quot;&gt;Gross domestic product: June 2026 quarter \u2013 changes and data updates \u2013 DataInfo+&lt;\/a&gt; has details of data updates for this release.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/methods\/overview-of-sources-and-methods-for-quarterly-gross-domestic-product-updates-and-covid-19-adjustments\/\&quot;&gt;Overview of sources and methods for quarterly gross domestic product: Updates and COVID-19 adjustments&lt;\/a&gt; provides an overview of changes to our usual quarterly GDP methods, including alternative data sources and methods we are using to measure the effects of COVID-19 in New Zealand
