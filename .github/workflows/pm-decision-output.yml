name: Accept PM Decision Output

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "data/pm/inbox/**/pm_decisions.json"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pm-decision-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-apply-merge:
    if: startsWith(github.event.pull_request.title, '[pm-decision]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify one data-only PM decision payload
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ "$HEAD_REPO" = "$BASE_REPO" ] || { echo "::error::PM output must originate in this repository"; exit 1; }
          mapfile -t FILES < <(gh api "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --paginate --jq '.[].filename')
          [ "${#FILES[@]}" -eq 1 ] || { printf 'Unexpected files:\n%s\n' "${FILES[@]}"; exit 1; }
          FILE="${FILES[0]}"
          [[ "$FILE" =~ ^data/pm/inbox/[^/]+/pm_decisions\.json$ ]] || { echo "::error::Unexpected PM decision path: $FILE"; exit 1; }
          mkdir -p /tmp/pm
          gh api "repos/$REPO/contents/$FILE?ref=$HEAD_SHA" --jq '.content' | tr -d '\n' | base64 -d > /tmp/pm/pm_decisions.json
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Validate decisions and simulate deterministic book update
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/pm_review.py validate --input /tmp/pm/pm_decisions.json
          PYTHONPATH=. python -m unittest tests.test_pm_layer -v
          PYTHONPATH=. python scripts/pm_review.py apply --input /tmp/pm/pm_decisions.json --output /tmp/pm/latest.json

      - name: Append canonical PM books and merge
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          mkdir -p data/pm/books
          cp /tmp/pm/latest.json data/pm/books/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pm/books/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply PM decisions"
            git push origin "HEAD:$HEAD_REF"
          fi
          gh pr merge "$PR_URL" --squash --delete-branch
