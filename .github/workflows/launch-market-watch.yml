name: Launch Market Watch

on:
  workflow_dispatch:
    inputs:
      session_date:
        description: "NY session date (YYYY-MM-DD); default is today in America/New_York"
        required: false
        type: string
      rerun:
        description: "Allocate a new same-day launch id (explicit rerun)"
        required: false
        type: boolean
        default: false
      mode:
        description: "fixture or live"
        required: true
        type: choice
        default: live
        options:
          - live
          - fixture
      provider:
        description: "acp (canonical overnight store) or stub (scratch only)"
        required: true
        type: choice
        default: acp
        options:
          - acp
          - stub
  issues:
    types: [opened]
  pull_request:
    # Inbox scheduled_output.json is accepted by pull_request_target
    # (overnight-scheduled-output.yml). Any other changed file still runs this suite.
    paths-ignore:
      - "data/overnight/inbox/**/scheduled_output.json"

permissions:
  contents: write
  issues: write

concurrency:
  # Only real launch requests share the serialized group. Other issues and pull
  # requests get a unique group so they can never replace a pending launch.
  group: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[launch-market-watch]'))) && 'market-watch-manual-launch' || format('market-watch-launch-other-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  guard:
    name: Guard launch origin
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'issues'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      session_date: ${{ steps.decide.outputs.session_date }}
      rerun: ${{ steps.decide.outputs.rerun }}
      mode: ${{ steps.decide.outputs.mode }}
      provider: ${{ steps.decide.outputs.provider }}
      actor_type: ${{ steps.decide.outputs.actor_type }}
      actor: ${{ steps.decide.outputs.actor }}
      issue_number: ${{ steps.decide.outputs.issue_number }}
      issue_title: ${{ steps.decide.outputs.issue_title }}
      issue_url: ${{ steps.decide.outputs.issue_url }}
      repository_permission: ${{ steps.decide.outputs.repository_permission }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Decide whether to launch
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER_TYPE: ${{ github.event.issue.user.type }}
          ISSUE_USER_LOGIN: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
          INPUT_SESSION_DATE: ${{ github.event.inputs.session_date }}
          INPUT_RERUN: ${{ github.event.inputs.rerun }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_PROVIDER: ${{ github.event.inputs.provider }}
          AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          proceed=false
          session_date=""
          rerun=false
          mode=live
          provider=acp
          actor_type=""
          actor=""
          issue_number=""
          issue_title=""
          issue_url=""
          repository_permission=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "${SENDER_TYPE}" != "User" ]; then
              echo "workflow_dispatch sender is not a human User; skipping launch"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            proceed=true
            session_date="${INPUT_SESSION_DATE}"
            rerun="${INPUT_RERUN:-false}"
            mode="${INPUT_MODE:-live}"
            provider="${INPUT_PROVIDER:-acp}"
            actor_type="${SENDER_TYPE}"
            actor="${SENDER_LOGIN}"
            if [ "$provider" = "acp" ] && [ "$mode" = "live" ]; then
              echo "live ACP launches require a human [launch-market-watch] issue so ACP can independently verify origin"
              proceed=false
            fi
          elif [ "$EVENT_NAME" = "issues" ]; then
            if [ "${ISSUE_USER_TYPE}" != "User" ]; then
              echo "issue author is not a human User; skipping launch"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! echo "$ISSUE_TITLE" | grep -Eq '^\[launch-market-watch\] [0-9]{4}-[0-9]{2}-[0-9]{2}( rerun)?$'; then
              echo "issue title does not match launch contract; skipping"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            proceed=true
            issue_title="$ISSUE_TITLE"
            issue_number="$ISSUE_NUMBER"
            issue_url="$ISSUE_URL"
            actor_type="${ISSUE_USER_TYPE}"
            actor="${ISSUE_USER_LOGIN}"
            parsed_date=$(echo "$ISSUE_TITLE" | sed -n 's/^\[launch-market-watch\] \([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\).*/\1/p')
            session_date="$parsed_date"
            if echo "$ISSUE_TITLE" | grep -q ' rerun$'; then
              rerun=true
            fi
            if [ -n "${ISSUE_BODY:-}" ]; then
              read -r body_mode body_provider body_rerun < <(PYTHONPATH=. python3 -c 'import os; from scripts.market_watch_launch.identity import parse_issue_body; d=parse_issue_body(os.environ.get("ISSUE_BODY","")); print(d.get("mode",""), d.get("provider",""), "true" if d.get("rerun") else "")')
              if [ -n "$body_mode" ]; then mode="$body_mode"; fi
              if [ -n "$body_provider" ]; then provider="$body_provider"; fi
              if [ "$body_rerun" = "true" ]; then rerun=true; fi
            fi
            if [ "${SENDER_LOGIN}" != "${ISSUE_USER_LOGIN}" ]; then
              echo "issue sender does not match the issue author; skipping launch"
              proceed=false
            fi
          fi

          if [ "$proceed" = "true" ]; then
            set +e
            repository_permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${actor}/permission" --jq .permission 2>/dev/null)
            api_code=$?
            set -e
            if [ "$api_code" -ne 0 ] || [ -z "${repository_permission}" ]; then
              if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                repository_permission="write"
              elif [ "${AUTHOR_ASSOCIATION}" = "OWNER" ]; then
                repository_permission="admin"
              else
                repository_permission="none"
              fi
            fi
            case "$repository_permission" in
              admin|maintain|write) ;;
              *)
                echo "refusing launch: ${actor} permission is ${repository_permission}"
                proceed=false
                ;;
            esac
          fi

          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          echo "session_date=$session_date" >> "$GITHUB_OUTPUT"
          echo "rerun=$rerun" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "actor_type=$actor_type" >> "$GITHUB_OUTPUT"
          echo "actor=$actor" >> "$GITHUB_OUTPUT"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "issue_title=$issue_title" >> "$GITHUB_OUTPUT"
          echo "issue_url=$issue_url" >> "$GITHUB_OUTPUT"
          echo "repository_permission=$repository_permission" >> "$GITHUB_OUTPUT"

  orchestrate:
    name: Orchestrate manual launch
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      launch_id: ${{ steps.launch.outputs.launch_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install market-state dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-market-state.txt

      - name: Run launch CLI
        id: launch
        env:
          SESSION_DATE: ${{ needs.guard.outputs.session_date }}
          RERUN: ${{ needs.guard.outputs.rerun }}
          MODE: ${{ needs.guard.outputs.mode }}
          PROVIDER: ${{ needs.guard.outputs.provider }}
          ACTOR_TYPE: ${{ needs.guard.outputs.actor_type }}
          ACTOR: ${{ needs.guard.outputs.actor }}
          ISSUE_NUMBER: ${{ needs.guard.outputs.issue_number }}
          ISSUE_TITLE: ${{ needs.guard.outputs.issue_title }}
          ISSUE_URL: ${{ needs.guard.outputs.issue_url }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY_PERMISSION: ${{ needs.guard.outputs.repository_permission }}
        run: |
          set -euo pipefail
          ARGS=(
            launch
            --mode "$MODE"
            --provider "$PROVIDER"
            --actor-type "$ACTOR_TYPE"
            --actor "$ACTOR"
            --repository-permission "$REPOSITORY_PERMISSION"
          )
          if [ "$PROVIDER" = "acp" ]; then
            ARGS+=(--through 04_freeze)
            if [ "$MODE" = "live" ]; then
              ARGS+=(--publish-production)
            fi
          fi
          if [ -n "${SESSION_DATE:-}" ]; then
            ARGS+=(--session-date "$SESSION_DATE")
          fi
          if [ "$RERUN" = "true" ]; then
            ARGS+=(--rerun)
          fi
          if [ "$EVENT_NAME" = "issues" ]; then
            ARGS+=(--source github_issue --issue-number "$ISSUE_NUMBER" --issue-title "$ISSUE_TITLE" --issue-url "$ISSUE_URL")
          else
            ARGS+=(--source workflow_dispatch)
          fi
          set +e
          export LAUNCH_RESULT="${RUNNER_TEMP}/launch-result.json"
          PYTHONPATH=. python3 -m scripts.market_watch_launch.cli "${ARGS[@]}" | tee "$LAUNCH_RESULT"
          code=$?
          set -e
          if [ ! -s "$LAUNCH_RESULT" ]; then
            echo "launch CLI produced no result"
            exit 1
          fi
          launch_id="$(python3 -c 'import json,os; print(json.load(open(os.environ["LAUNCH_RESULT"]))["launch_id"])')"
          echo "launch_id=$launch_id" >> "$GITHUB_OUTPUT"
          echo "cli_code=$code" >> "$GITHUB_OUTPUT"

      - name: Commit freeze and ledger
        if: always() && steps.launch.outputs.launch_id != ''
        env:
          PROVIDER: ${{ needs.guard.outputs.provider }}
          LAUNCH_ID: ${{ steps.launch.outputs.launch_id }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m scripts.market_watch_launch.persist_boundary --provider "$PROVIDER"
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: market watch launch ${LAUNCH_ID} freeze"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Verify remote freeze attestation
        if: needs.guard.outputs.provider == 'acp' && steps.launch.outputs.launch_id != ''
        env:
          LAUNCH_ID: ${{ steps.launch.outputs.launch_id }}
        run: |
          set -euo pipefail
          attestation="data/market_watch_launches/${LAUNCH_ID}/remote_freeze.json"
          git fetch origin "${GITHUB_REF_NAME}"
          if [ -f "$attestation" ] && git show "origin/${GITHUB_REF_NAME}:${attestation}" >/dev/null 2>&1; then
            echo "remote freeze already attested"
            exit 0
          fi
          remote_sha="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          local_binding="data/market_watch_launches/${LAUNCH_ID}/freeze_binding.json"
          if [ ! -f "$local_binding" ]; then
            echo "freeze binding absent; stage 05 stays blocked"
            exit 0
          fi
          git show "${remote_sha}:${local_binding}" > /tmp/remote-freeze-binding.json
          cmp -s "$local_binding" /tmp/remote-freeze-binding.json
          BINDING="$local_binding" LAUNCH_DIR="data/market_watch_launches/${LAUNCH_ID}" COMMIT_SHA="$remote_sha" \
            PYTHONPATH=. python3 -c 'import json,os; from pathlib import Path; from scripts.market_watch_launch.durability import record_remote_freeze; b=json.load(open(os.environ["BINDING"])); record_remote_freeze(Path(os.environ["LAUNCH_DIR"]), commit_sha=os.environ["COMMIT_SHA"], packet_sha256=str(b.get("packet_sha256") or ""), trader_books_sha256=str(b.get("starting_trader_books_sha256") or ""), pm_books_sha256=str(b.get("starting_pm_books_sha256") or ""), score_state_sha256=str(b.get("score_state_sha256") or ""))'
          git add "$attestation"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: market watch launch ${LAUNCH_ID} remote freeze attestation"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git fetch origin "${GITHUB_REF_NAME}"
          attested="$(git rev-parse "origin/${GITHUB_REF_NAME}:${attestation}")"
          test -n "$attested"

      - name: Fail the job when the launch itself failed
        if: always() && steps.launch.outputs.cli_code == '1'
        run: exit 1

  research:
    name: Publish research edition
    needs: [guard, orchestrate]
    if: >-
      needs.orchestrate.result == 'success' &&
      needs.orchestrate.outputs.launch_id != '' &&
      needs.guard.outputs.provider == 'acp' &&
      needs.guard.outputs.mode == 'live' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Every production Pages writer runs guard -> deploy -> verify -> receipt
    # inside this one group, so a final deploy cannot interleave with it.
    concurrency:
      group: pages-production
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      eligible: ${{ steps.select.outputs.eligible }}
      verified: ${{ steps.verify.outcome == 'success' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install market-state dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-market-state.txt

      - name: Select this launch's verified Stage 04 freeze
        id: select
        env:
          PYTHONPATH: .
          LAUNCH_ID: ${{ needs.orchestrate.outputs.launch_id }}
        run: python3 -m scripts.market_watch_launch.research_pages select --launch-id "$LAUNCH_ID"

      - name: Build and validate research edition
        id: build
        if: steps.select.outputs.eligible == 'true'
        env:
          PYTHONPATH: .
          LAUNCH_ID: ${{ steps.select.outputs.launch_id }}
          REVIEW_ID: ${{ steps.select.outputs.review_id }}
          PACKET_SHA256: ${{ steps.select.outputs.packet_sha256 }}
        run: |
          set -euo pipefail
          python3 -m scripts.market_watch_launch.research_pages build \
            --launch-id "$LAUNCH_ID" \
            --review-id "$REVIEW_ID" \
            --packet-sha256 "$PACKET_SHA256" \
            --site-dir _site \
            --channel production \
            --fetch-schedules --schedule-timeout 6
          test -s _site/release.json
          mkdir -p "${RUNNER_TEMP}/research"
          cp _site/release.json "${RUNNER_TEMP}/research/release.json"

      - name: Upload Pages artifact
        if: steps.select.outputs.eligible == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site

      - name: Configure Pages
        id: pages
        if: steps.select.outputs.eligible == 'true'
        uses: actions/configure-pages@v5

      - name: Recheck eligibility and publication order on fresh main
        id: guard
        if: steps.select.outputs.eligible == 'true'
        env:
          PYTHONPATH: .
          PUBLIC_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          git fetch origin main && git checkout -q --detach origin/main
          python3 -m scripts.market_watch_launch.research_pages guard \
            --site-dir "${RUNNER_TEMP}/research" \
            --public-base-url "$PUBLIC_BASE_URL"

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.guard.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-research-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 600000

      - name: Verify public page serves this research edition
        id: verify
        if: steps.deployment.outcome == 'success'
        continue-on-error: true
        env:
          PYTHONPATH: .
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python3 -m scripts.market_watch_launch.publication_release verify-public \
            --release "${RUNNER_TEMP}/research/release.json" \
            --page-url "$PAGE_URL"

      - name: Commit research publication receipt
        if: always() && steps.deployment.outcome == 'success'
        env:
          PYTHONPATH: .
          LAUNCH_ID: ${{ steps.select.outputs.launch_id }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PUBLIC_STATE: ${{ steps.verify.outputs.public_state }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          receipt="data/market_watch_launches/${LAUNCH_ID}/research_pages.json"
          for attempt in 1 2 3 4 5; do
            python3 -m scripts.market_watch_launch.research_pages record \
              --release "${RUNNER_TEMP}/research/release.json" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --run-url "$RUN_URL" \
              --page-url "$PAGE_URL" \
              --public-state "${PUBLIC_STATE:-unknown}"
            git add -- "$receipt"
            if git diff --cached --quiet; then
              echo "research receipt already recorded"
              exit 0
            fi
            unexpected="$(git diff --cached --name-only | grep -vxF "$receipt" || true)"
            if [ -n "$unexpected" ]; then
              echo "::error::research receipt commit staged unexpected paths: $unexpected"
              exit 1
            fi
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: market watch launch ${LAUNCH_ID} research pages receipt"
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            sleep $((attempt * 4))
            git fetch origin main
            git reset --hard origin/main
          done
          echo "::error::could not push research receipt"
          exit 1

      - name: Fail when the public read-back did not verify
        if: always() && steps.deployment.outcome == 'success' && steps.verify.outcome != 'success'
        run: |
          echo "::error::public read-back did not verify the deployed research edition"
          exit 1

  handoff:
    name: Record Stage 05 delegation request (non-executing)
    needs: [guard, orchestrate, research]
    if: >-
      always() &&
      needs.orchestrate.result == 'success' &&
      needs.orchestrate.outputs.launch_id != '' &&
      needs.guard.outputs.provider == 'acp' &&
      (needs.research.result == 'success' || (needs.research.result == 'skipped' && needs.guard.outputs.mode != 'live'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Record Stage 05 delegation request
        env:
          LAUNCH_ID: ${{ needs.orchestrate.outputs.launch_id }}
        run: |
          set -euo pipefail
          # Stage 05 writes a request only; it does not call ACP or any model.
          # For two-trigger launches it stays pending until research_pages.json
          # shows a verified public read-back.
          if [ ! -f "data/market_watch_launches/${LAUNCH_ID}/remote_freeze.json" ]; then
            echo "remote freeze was not attested; not recording stage 05"
            exit 0
          fi
          HANDOFF_RESULT="${RUNNER_TEMP}/handoff-result.json"
          PYTHONPATH=. python3 -m scripts.market_watch_launch.cli stage --launch-id "$LAUNCH_ID" --name 05_acp_handoff | tee "$HANDOFF_RESULT"
          git add data/market_watch_launches
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: market watch launch ${LAUNCH_ID} stage 05 delegation request"
          git pull --rebase origin main
          git push origin HEAD:main

  unit-tests:
    name: Market Watch launch unit tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install market-state dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-market-state.txt

      - name: Run unit tests
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m unittest \
            tests.test_mw_launch_persist_boundary \
            tests.test_mw_launch_pages_recovery \
            tests.test_mw_launch_graph \
            tests.test_mw_launch_quality \
            tests.test_mw_launch_lineage \
            tests.test_mw_launch_completion \
            tests.test_mw_launch_integration \
            tests.test_mw_launch_pages_dispatch_confirmation \
            tests.test_mw_publication_release \
            tests.test_mw_launch_milestones \
            tests.test_mw_two_trigger_contract \
            tests.test_mw_research_pages \
            tests.test_mw_research_headlines \
            tests.test_mw_pages_in_run_reconcile \
            tests.test_mw_research_parity \
            -v
