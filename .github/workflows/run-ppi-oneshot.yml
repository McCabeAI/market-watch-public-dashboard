name: Run CPI/PPI release

# One manual issue runs one month. Titles are exactly `[run-cpi] YYYY-MM`
# or `[run-ppi] YYYY-MM`. The September 2026 regression title remains
# `[run-ppi] 2026-09` and its pre-PPI central is
# +0.3688405280179773205064998201.
# This file does not poll, schedule, deploy, or call a model.

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write
  # Artifact upload. This workflow does not deploy.
  actions: write

concurrency:
  group: run-ppi-oneshot-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize release issue
    if: >-
      (startsWith(github.event.issue.title, '[run-ppi] ') || startsWith(github.event.issue.title, '[run-cpi] ')) &&
      github.event.issue.user.type == 'User' &&
      github.event.sender.type == 'User' &&
      github.event.sender.login == github.event.issue.user.login
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
      reason: ${{ steps.auth.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Authorize issue creator
        id: auth
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR_LOGIN: ${{ github.event.issue.user.login }}
          ISSUE_AUTHOR_TYPE: ${{ github.event.issue.user.type }}
          ISSUE_SENDER_LOGIN: ${{ github.event.sender.login }}
          ISSUE_SENDER_TYPE: ${{ github.event.sender.type }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m scripts.core_pce_release authorize-release-issue

  execute:
    name: One-shot CPI baseline or PPI update
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore CPI packet for PPI runs
        if: startsWith(github.event.issue.title, '[run-ppi] ')
        env:
          OUT_DIR: ${{ runner.temp }}/core-pce-release
          ISSUE_TITLE: ${{ github.event.issue.title }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m scripts.core_pce_release restore-cpi-packet --out "$OUT_DIR" || true

      - name: Calculate once
        id: calc
        env:
          OUT_DIR: ${{ runner.temp }}/core-pce-release
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BLS_REGISTRATION_KEY: ${{ secrets.BLS_REGISTRATION_KEY }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m scripts.core_pce_release dispatch-issue --out "$OUT_DIR"

      - name: Upload CPI packet artifact
        if: steps.calc.outcome == 'success' && startsWith(github.event.issue.title, '[run-cpi] ')
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          OUT_DIR: ${{ runner.temp }}/core-pce-release
        run: |
          set -euo pipefail
          RELEASE=$(PYTHONPATH=. python3 -c 'import os; from scripts.core_pce_release.release_bundle import parse_issue_title; print(parse_issue_title(os.environ["ISSUE_TITLE"])[1])')
          test -d "$OUT_DIR/cpi_packet"
          echo "artifact_release=$RELEASE" >> "$GITHUB_OUTPUT"
        id: cpi_packet_meta

      - name: Publish CPI packet artifact
        if: steps.calc.outcome == 'success' && startsWith(github.event.issue.title, '[run-cpi] ')
        uses: actions/upload-artifact@v4
        with:
          name: core-pce-cpi-packet-${{ steps.cpi_packet_meta.outputs.artifact_release }}
          path: ${{ runner.temp }}/core-pce-release/cpi_packet
          retention-days: 30
          if-no-files-found: ignore

      - name: Comment numerical result
        if: steps.calc.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OUT_DIR: ${{ runner.temp }}/core-pce-release
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body-file "$OUT_DIR/comment.md" || gh issue comment "$ISSUE_NUMBER" --body-file "$OUT_DIR/flash.txt"

      - name: Upload audit artifact
        if: steps.calc.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: run-release-${{ github.run_id }}
          path: ${{ runner.temp }}/core-pce-release
          retention-days: 30
          if-no-files-found: error

      - name: Comment execution error
        if: failure() && steps.calc.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; Path("/tmp/run-release-error.md").write_text("availability: ERROR\nreason: oneshot_execution_failed\nestimate: not_published\nNo revised core PCE figure was published. This run does not schedule a retry.\nlistener: not_invoked\narm: not_invoked\nretries_scheduled: 0\n", encoding="utf-8")'
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/run-release-error.md
