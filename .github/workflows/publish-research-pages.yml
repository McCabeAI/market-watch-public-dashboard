name: Publish Market Watch Research Edition

on:
  # Research edition of the live launch, published once Stage 04 is verified and
  # remotely attested. There is deliberately no workflow_dispatch and no
  # schedule: the only trigger is completion of a human-initiated launch run on
  # main, and every job re-derives eligibility from the committed launch state.
  # Re-running a run of this workflow is the idempotent recovery path.
  workflow_run:
    workflows: ["Launch Market Watch"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: market-watch-research-pages
  cancel-in-progress: false

jobs:
  research:
    name: Build research edition
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'issues' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      eligible: ${{ steps.gate.outputs.gate == 'open' && steps.select.outputs.eligible == 'true' }}
      launch_id: ${{ steps.select.outputs.launch_id }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install market-state dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-market-state.txt

      - name: Select live launch with verified Stage 04
        id: select
        env:
          PYTHONPATH: .
        run: python3 -m scripts.market_watch_launch.research_pages select

      - name: Refuse while a final Pages deploy is queued or running
        id: gate
        if: steps.select.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: .
        run: |
          set -euo pipefail
          runs="${RUNNER_TEMP}/deploy-pages-runs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/runs?branch=main&event=workflow_dispatch&per_page=50" > "$runs"
          python3 -m scripts.market_watch_launch.research_pages gate --runs-json "$runs"

      - name: Build and validate research edition
        id: build
        if: steps.gate.outputs.gate == 'open'
        env:
          PYTHONPATH: .
          LAUNCH_ID: ${{ steps.select.outputs.launch_id }}
          REVIEW_ID: ${{ steps.select.outputs.review_id }}
          PACKET_SHA256: ${{ steps.select.outputs.packet_sha256 }}
        run: |
          set -euo pipefail
          python3 -m scripts.market_watch_launch.research_pages build \
            --launch-id "$LAUNCH_ID" \
            --review-id "$REVIEW_ID" \
            --packet-sha256 "$PACKET_SHA256" \
            --site-dir _site \
            --channel production \
            --fetch-schedules --schedule-timeout 6
          test -s _site/release.json
          cp _site/release.json "${RUNNER_TEMP}/release.json"

      - name: Upload research release
        if: steps.gate.outputs.gate == 'open'
        uses: actions/upload-artifact@v4
        with:
          name: research-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release.json
          if-no-files-found: error

      - name: Upload Pages artifact
        if: steps.gate.outputs.gate == 'open'
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site

  deploy:
    name: Deploy research edition
    needs: research
    if: needs.research.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same group as production deploy-pages. A final deploy dispatched later
    # cancels this job; this job never cancels an in-progress final deploy.
    concurrency:
      group: pages-production
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deployed: ${{ steps.deployment.outcome == 'success' }}
      page_url: ${{ steps.deployment.outputs.page_url }}
      public_state: ${{ steps.verify.outputs.public_state }}
    steps:
      - name: Checkout fresh main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download research release
        uses: actions/download-artifact@v4
        with:
          name: research-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Recheck eligibility and publication order on fresh main
        id: guard
        env:
          PYTHONPATH: .
          PUBLIC_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          python3 -m scripts.market_watch_launch.research_pages guard \
            --site-dir "${RUNNER_TEMP}/research" \
            --public-base-url "$PUBLIC_BASE_URL"

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.guard.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-research-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify public page serves this research edition
        id: verify
        if: steps.deployment.outcome == 'success'
        env:
          PYTHONPATH: .
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python3 -m scripts.market_watch_launch.publication_release verify-public \
            --release "${RUNNER_TEMP}/research/release.json" \
            --page-url "$PAGE_URL" \
            --allow-superseded

  record:
    name: Record research publication receipt
    needs: [research, deploy]
    # A completed Pages deploy is recorded even when the public read-back did
    # not confirm it, so the committed ordering state never under-reports.
    if: always() && needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download research release
        uses: actions/download-artifact@v4
        with:
          name: research-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research

      - name: Commit research_pages.json only
        env:
          PYTHONPATH: .
          LAUNCH_ID: ${{ needs.research.outputs.launch_id }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          PUBLIC_STATE: ${{ needs.deploy.outputs.public_state }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          receipt="data/market_watch_launches/${LAUNCH_ID}/research_pages.json"
          for attempt in 1 2 3 4 5; do
            python3 -m scripts.market_watch_launch.research_pages record \
              --release "${RUNNER_TEMP}/research/release.json" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --run-url "$RUN_URL" \
              --page-url "$PAGE_URL" \
              --public-state "${PUBLIC_STATE:-unknown}"
            git add -- "$receipt"
            if git diff --cached --quiet; then
              echo "research receipt already recorded"
              exit 0
            fi
            unexpected="$(git diff --cached --name-only | grep -vxF "$receipt" || true)"
            if [ -n "$unexpected" ]; then
              echo "::error::research receipt commit staged unexpected paths: $unexpected"
              exit 1
            fi
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: market watch launch ${LAUNCH_ID} research pages receipt"
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            sleep $((attempt * 4))
            git fetch origin main
            git reset --hard origin/main
          done
          echo "::error::could not push research receipt"
          exit 1
