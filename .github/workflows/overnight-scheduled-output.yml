name: Accept ACP Overnight Output

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "data/overnight/inbox/**/scheduled_output.json"

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  inspect:
    if: startsWith(github.event.pull_request.title, '[overnight-output]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      file: ${{ steps.inspect.outputs.file }}
      run_id: ${{ steps.inspect.outputs.run_id }}
    steps:
      - name: Verify data-only scheduled-output PR
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ "$HEAD_REPO" = "$BASE_REPO" ] || { echo "::error::Scheduled output must originate in the target repository"; exit 1; }
          mapfile -t FILES < <(gh api "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --paginate --jq '.[].filename')
          [ "${#FILES[@]}" -eq 1 ] || { printf 'Unexpected files:\n%s\n' "${FILES[@]}"; exit 1; }
          FILE="${FILES[0]}"
          [[ "$FILE" =~ ^data/overnight/inbox/overnight-[0-9]{8}/scheduled_output\.json$ ]] || {
            echo "::error::Unexpected scheduled-output path: $FILE"; exit 1;
          }
          RUN_ID="$(basename "$(dirname "$FILE")")"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

  validate-apply-merge:
    if: startsWith(github.event.pull_request.title, '[overnight-output]')
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: overnight-accept-${{ needs.inspect.outputs.run_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Record canonical book blobs on trusted main
        id: record-blobs
        run: |
          set -euo pipefail
          echo "trader_book_blob=$(git rev-parse HEAD:data/overnight/books/latest.json)" >> "$GITHUB_OUTPUT"
          echo "pm_book_blob=$(git rev-parse HEAD:data/pm/books/latest.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download scheduled output from PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FILE: ${{ needs.inspect.outputs.file }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mw-output
          gh api "repos/$REPO/contents/$FILE?ref=$HEAD_SHA" --jq '.content' \
            | tr -d '\n' | base64 -d > /tmp/mw-output/scheduled_output.json

      - name: Verify output is bound to the trusted manual launch
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.market_watch_launch.durability import remote_freeze_verified

          payload = json.loads(Path("/tmp/mw-output/scheduled_output.json").read_text())
          launch_id = str(payload.get("launch_id") or "")
          if not launch_id:
              raise SystemExit("manual scheduled output is missing launch_id")
          launch_dir = Path("data/market_watch_launches") / launch_id
          launch = json.loads((launch_dir / "launch.json").read_text())
          freeze = ((launch.get("stages") or {}).get("04_freeze") or {})
          details = freeze.get("details") or {}
          if freeze.get("status") != "succeeded":
              raise SystemExit("bound launch freeze did not succeed")
          if (launch.get("request") or {}).get("provider") != "acp":
              raise SystemExit("bound launch is not ACP")
          if (launch.get("request") or {}).get("mode") != "live":
              raise SystemExit("bound launch is not live")
          if (launch.get("request") or {}).get("publish_production") is not True:
              raise SystemExit("bound launch did not authorize production publication")
          if payload.get("review_id") != details.get("review_id"):
              raise SystemExit("scheduled output review_id does not match manual freeze")
          if payload.get("base_packet_sha256") != details.get("packet_sha256"):
              raise SystemExit("scheduled output packet SHA does not match manual freeze")
          if payload.get("overnight_run_id") != details.get("overnight_run_id"):
              raise SystemExit("scheduled output run id does not match manual freeze")
          if not remote_freeze_verified(launch_dir):
              raise SystemExit("manual freeze lacks verified remote attestation")
          print(launch_id)
          PY

      - name: Restore exact freeze-bound books if assembly only marked statuses stale
        env:
          RUN_ID: ${{ needs.inspect.outputs.run_id }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.overnight.reviews import restore_assembly_stale_overlay_for_acceptance
          from scripts.overnight.store import OvernightStore
          payload = json.loads(Path("/tmp/mw-output/scheduled_output.json").read_text())
          assert payload["overnight_run_id"] == os.environ["RUN_ID"]
          changed = restore_assembly_stale_overlay_for_acceptance(
              OvernightStore(), run_id=payload["overnight_run_id"], review_id=payload["review_id"]
          )
          print("Trusted runner-local freeze-bound book restore:", "performed" if changed else "not needed")
          PY

      - name: Validate and deterministically simulate books/P&L
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 scripts/overnight/scheduled_output.py validate \
            --input /tmp/mw-output/scheduled_output.json
          PYTHONPATH=. python3 -m unittest \
            tests.test_overnight_pipeline \
            tests.test_overnight_scheduled_output \
            tests.test_overnight_acceptance_handoff \
            tests.test_pm_scheduled_output \
            tests.test_pm_overnight_packets \
            tests.test_pm_portfolio \
            tests.test_trading_memory -v

      - name: Generate canonical deterministic state from trusted main
        env:
          RUN_ID: ${{ needs.inspect.outputs.run_id }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 scripts/overnight/scheduled_output.py apply \
            --input /tmp/mw-output/scheduled_output.json
          mkdir -p /tmp/mw-generated
          cp -a "data/overnight/books" /tmp/mw-generated/
          mkdir -p "/tmp/mw-generated/runs/$RUN_ID"
          cp "data/overnight/runs/$RUN_ID/run.json" "/tmp/mw-generated/runs/$RUN_ID/run.json"
          if [ -d "data/overnight/runs/$RUN_ID/reviews" ]; then
            mkdir -p "/tmp/mw-generated/runs/$RUN_ID/reviews"
            cp -a "data/overnight/runs/$RUN_ID/reviews/." "/tmp/mw-generated/runs/$RUN_ID/reviews/"
          fi
          if [ -d data/pm ]; then
            mkdir -p /tmp/mw-generated/pm
            for name in books review_packets public data_requests; do
              if [ -e "data/pm/$name" ]; then
                cp -a "data/pm/$name" "/tmp/mw-generated/pm/$name"
              fi
            done
          fi
          if [ -d data/trading ]; then
            mkdir -p /tmp/mw-generated/trading
            cp -a data/trading/. /tmp/mw-generated/trading/
          fi
          if [ -d "data/overnight/runs/$RUN_ID/memory" ]; then
            mkdir -p "/tmp/mw-generated/runs/$RUN_ID/memory"
            cp -a "data/overnight/runs/$RUN_ID/memory/." "/tmp/mw-generated/runs/$RUN_ID/memory/"
          fi
          if [ -d "data/overnight/runs/$RUN_ID/pm_memory" ]; then
            mkdir -p "/tmp/mw-generated/runs/$RUN_ID/pm_memory"
            cp -a "data/overnight/runs/$RUN_ID/pm_memory/." "/tmp/mw-generated/runs/$RUN_ID/pm_memory/"
          fi

      - name: Append deterministic state to the scheduled-output branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          RUN_ID: ${{ needs.inspect.outputs.run_id }}
          GENERATED_DIR: /tmp/mw-generated
        run: bash scripts/overnight/append_generated_state.sh

      - name: Revalidate canonical book blobs before merge
        env:
          TRADER_BOOK_BLOB: ${{ steps.record-blobs.outputs.trader_book_blob }}
          PM_BOOK_BLOB: ${{ steps.record-blobs.outputs.pm_book_blob }}
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_TRADER="$(git rev-parse origin/main:data/overnight/books/latest.json)"
          CURRENT_PM="$(git rev-parse origin/main:data/pm/books/latest.json)"
          if [ "$CURRENT_TRADER" != "$TRADER_BOOK_BLOB" ]; then
            echo "::error::Canonical trader books on main changed after validation (was $TRADER_BOOK_BLOB, now $CURRENT_TRADER). Aborting merge."
            exit 1
          fi
          if [ "$CURRENT_PM" != "$PM_BOOK_BLOB" ]; then
            echo "::error::Canonical PM books on main changed after validation (was $PM_BOOK_BLOB, now $CURRENT_PM). Aborting merge."
            exit 1
          fi

      - name: Merge accepted scheduled output
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MW_PAGES_REQUIRE_LAUNCH: "1"
          MW_PAGES_OUTPUT: /tmp/mw-output/scheduled_output.json
        run: bash scripts/overnight/merge_accepted_output.sh

      - name: Persist accepted launch through finalization
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER_PAYLOAD_PATH: /tmp/mw-output/scheduled_output.json
          MW_DEFER_PAGES: "1"
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          launch_id="$(python3 -c 'import json; print(json.load(open("/tmp/mw-output/scheduled_output.json"))["launch_id"])')"
          LAUNCH_ID="$launch_id" PYTHONPATH=. python3 -m scripts.market_watch_launch.continuation | tee /tmp/mw-output/continuation-finalize.json
          git add data/market_watch_launches data/overnight data/pm data/trading 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: finalize market watch launch $launch_id"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          git fetch origin main
          git show "origin/main:data/market_watch_launches/$launch_id/launch.json" >/tmp/mw-output/remote-launch.json
          python3 -c 'import json; d=json.load(open("/tmp/mw-output/remote-launch.json")); assert d["stages"]["06_acceptance"]["status"]=="succeeded"; assert d["stages"]["07_finalize"]["status"]=="succeeded"'

      - name: Explicitly dispatch Pages for the finalized launch
        env:
          GH_TOKEN: ${{ github.token }}
          MW_ENABLE_PAGES_DISPATCH: "1"
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          launch_id="$(python3 -c 'import json; print(json.load(open("/tmp/mw-output/scheduled_output.json"))["launch_id"])')"
          payload="$(python3 -c 'import json; d=json.load(open("/tmp/mw-output/scheduled_output.json")); print(json.dumps({"launch_id":d["launch_id"],"review_id":d["review_id"],"base_packet_sha256":d["base_packet_sha256"]},separators=(",",":")))' )"
          LAUNCH_ID="$launch_id" CLIENT_PAYLOAD="$payload" MW_CONTINUATION_DECISION=/tmp/mw-output/continuation-pages.json \
            PYTHONPATH=. python3 -m scripts.market_watch_launch.continuation
          python3 -c 'import json; d=json.load(open("/tmp/mw-output/continuation-pages.json")); assert d["status"]=="succeeded"; assert d["production_published"] is True'
          git add "data/market_watch_launches/$launch_id" "data/market_watch_launches/index.json"
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: record market watch launch $launch_id Pages dispatch"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
