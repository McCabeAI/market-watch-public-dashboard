name: Daily Market State

on:
  schedule:
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/market_state.py"
      - "scripts/australia_housing_data.py"
      - "scripts/us_housing_data.py"
      - "scripts/canada_housing_data.py"
      - "scripts/policy_path_data.py"
      - "scripts/official_curve_data.py"
      - "scripts/positioning_data.py"
      - "scripts/market_opportunities.py"
      - "scripts/cross_asset_data.py"
      - "tests/test_market_opportunities.py"
      - "scripts/live_market_state_smoke.py"
      - "scripts/live_official_curve_smoke.py"
      - "scripts/euro_area_rates_data.py"
      - "scripts/japan_rates_data.py"
      - "scripts/country_registry.py"
      - "data/country_registry.json"
      - "scripts/__init__.py"
      - "tests/test_market_state.py"
      - "tests/test_euro_area_rates_data.py"
      - "tests/test_japan_rates_data.py"
      - "tests/test_australia_housing_data.py"
      - "tests/test_us_canada_housing_data.py"
      - "tests/test_policy_path_data.py"
      - "tests/test_official_curve_data.py"
      - "tests/test_positioning_data.py"
      - "requirements-market-state.txt"
      - ".github/workflows/daily-market-state.yml"
      - "docs/MARKET_STATE_FEED_V1.md"
      - "patch_v12/**"
      - "scripts/apply_market_data_tab.py"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read

# Schedule and pull_request do not share a concurrency group. A delayed
# weekday cron must not be cancelled by a PR run that touches this workflow.
concurrency:
  group: daily-market-state-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Tests and live official-source smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check -r requirements-market-state.txt

      - name: Deterministic parser and calculation tests
        run: PYTHONPATH=. python -m unittest tests.test_market_state tests.test_australia_housing_data tests.test_us_canada_housing_data tests.test_policy_path_data tests.test_official_curve_data tests.test_market_opportunities tests.test_positioning_data tests.test_euro_area_rates_data tests.test_japan_rates_data tests.test_country_registry -v

      - name: Live official-source smoke test
        run: PYTHONPATH=. python scripts/live_market_state_smoke.py

  generate:
    name: Generate market-state packet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check -r requirements-market-state.txt

      - name: Generate market-state packet
        run: |
          set -euo pipefail
          mkdir -p /tmp/market-state
          PYTHONPATH=. python scripts/market_state.py --output /tmp/market-state/market-state.json
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.market_state import validate_snapshot
          packet = json.loads(Path("/tmp/market-state/market-state.json").read_text())
          validate_snapshot(packet)
          assert packet["method"]["model_calls"] == 0
          assert packet["method"]["credentials_required"] == []
          assert packet["method"]["fx_source"] == "ecb_euro_reference_crosses"
          assert packet["method"]["fx_pair_count"] == 45
          assert packet["method"]["rate_rv_count"] == 45
          assert set(packet["rates"]) == {"US", "CA", "AU", "NZ", "EA", "JP"}
          assert "TWELVE_DATA" not in json.dumps(packet)
          assert packet["positioning"]["status"] in {"ok", "partial", "stale", "unavailable"}
          assert packet["positioning"]["method"]["model_calls"] == 0
          assert packet["positioning"]["method"]["credentials_required"] == []
          assert packet["policy_paths"]["status"] in {"ok", "partial"}
          assert {"US", "CA", "AU"}.issubset(set(packet["policy_paths"]["countries"]))
          us_policy = packet["policy_paths"]["countries"]["US"]
          assert us_policy["status"] in {"ok", "partial"}
          assert us_policy["benchmark"]["rate"] is not None
          assert us_policy["benchmark"].get("history") or us_policy["benchmark"].get("as_of")
          for country in ("CA", "AU"):
              assert packet["policy_paths"]["countries"][country]["status"] == "ok"
          assert packet["tradable_rate_curves"]["status"] in {"ok", "partial"}
          assert {"SOFR", "CORRA", "AONIA"}.issubset(set(packet["tradable_rate_curves"]["curves"]))
          assert "ESTR" in packet["tradable_rate_curves"]["curves"]
          assert "TONA" in packet["tradable_rate_curves"]["curves"]
          sofr_curve = packet["tradable_rate_curves"]["curves"]["SOFR"]
          if sofr_curve["status"] != "ok":
              assert sofr_curve.get("error")
              assert us_policy["benchmark"]["source"] == "NY_FED" or "NY" in str(us_policy["benchmark"].get("source_url", "")).upper()
          else:
              assert sofr_curve["contracts"]
          for curve_id in ("CORRA", "AONIA"):
              curve = packet["tradable_rate_curves"]["curves"][curve_id]
              assert curve["status"] == "ok"
              assert curve["contracts"]
          assert packet["official_curves"]["status"] in {"ok", "partial", "unavailable"}
          assert packet["euro_area_fragmentation"]["status"] in {"ok", "partial", "unavailable"}
          assert packet["euro_area_housing"]["status"] in {"ok", "partial", "unavailable"}
          assert packet["japan_housing"]["status"] in {"ok", "partial", "unavailable"}
          assert packet["australia_housing"]["status"] in {"ok", "partial"}, packet["australia_housing"]
          assert packet["us_housing"]["status"] in {"ok", "partial"}, packet["us_housing"]
          assert packet["canada_housing"]["status"] in {"ok", "partial"}, packet["canada_housing"]
          assert set(packet["australia_housing"]["feeds"]) == {"prices_and_turnover", "building_approvals", "housing_lending", "housing_credit", "mortgage_rates", "mortgage_cash_flow"}
          nz = packet["rates"]["NZ"]
          if nz.get("status") == "unavailable":
              assert "NZ_rates" in packet["unavailable_sources"]
              assert packet["rate_rv"]["NZ-US_2Y"]["status"] == "unavailable"
          else:
              assert nz.get("status") in ("ok", "stale")
          print({
              "status": packet["status"],
              "fx_as_of": packet["fx"]["source_observation"],
              "rate_as_of": {k: v.get("latest_observation") for k, v in packet["rates"].items()},
              "stale_sources": packet["stale_sources"],
              "unavailable_sources": packet.get("unavailable_sources", []),
              "positioning_status": packet["positioning"]["status"],
              "tradable_curve_contracts": {k: len(v.get("contracts", [])) for k, v in packet["tradable_rate_curves"]["curves"].items()},
              "official_curve_status": packet["official_curves"]["status"],
          })
          PY

      - name: Upload market-state artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-state
          path: /tmp/market-state/market-state.json
          retention-days: 5
