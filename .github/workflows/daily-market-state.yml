name: Daily Market State

on:
  schedule:
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/market_state.py"
      - "scripts/live_market_state_smoke.py"
      - "scripts/__init__.py"
      - "tests/test_market_state.py"
      - "requirements-market-state.txt"
      - ".github/workflows/daily-market-state.yml"
      - "docs/MARKET_STATE_FEED_V1.md"

permissions:
  contents: read

concurrency:
  group: daily-market-state
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and live official-source smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check -r requirements-market-state.txt

      - name: Deterministic parser and calculation tests
        run: PYTHONPATH=. python -m unittest tests.test_market_state -v

      - name: Live official-source smoke test
        run: PYTHONPATH=. python scripts/live_market_state_smoke.py

  generate:
    name: Generate market-state packet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check -r requirements-market-state.txt

      - name: Fetch official RBNZ B2 workbook
        id: rbnz
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/market-state
          curl -fL --retry 3 --retry-delay 2 \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
            -H "Accept: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/octet-stream,*/*" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -H "Referer: https://www.rbnz.govt.nz/statistics/series/exchange-and-interest-rates/wholesale-interest-rates" \
            -o /tmp/market-state/hb2-daily-close.xlsx \
            "https://www.rbnz.govt.nz/-/media/project/sites/rbnz/files/statistics/series/b/b2/hb2-daily-close.xlsx"
          python - <<'PY'
          from pathlib import Path
          path = Path("/tmp/market-state/hb2-daily-close.xlsx")
          data = path.read_bytes()
          if data[:2] != b"PK":
              raise SystemExit(f"RBNZ download was not an xlsx workbook; starts with {data[:40]!r}")
          print(f"downloaded official RBNZ B2 workbook ({path.stat().st_size} bytes)")
          PY

      - name: Generate market-state packet
        if: steps.rbnz.outcome == 'success'
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/market_state.py --output /tmp/market-state/market-state.json --nz-workbook /tmp/market-state/hb2-daily-close.xlsx
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.market_state import validate_snapshot
          packet = json.loads(Path("/tmp/market-state/market-state.json").read_text())
          validate_snapshot(packet)
          assert packet["method"]["model_calls"] == 0
          assert packet["method"]["credentials_required"] == []
          assert packet["method"]["fx_source"] == "ecb_euro_reference_crosses"
          assert packet["method"]["fx_pair_count"] == 45
          assert packet["method"]["rate_rv_count"] == 15
          assert set(packet["rates"]) == {"US", "CA", "AU", "NZ"}
          assert "TWELVE_DATA" not in json.dumps(packet)
          print({
              "status": packet["status"],
              "fx_as_of": packet["fx"]["source_observation"],
              "rate_as_of": {k: v["latest_observation"] for k, v in packet["rates"].items()},
              "stale_sources": packet["stale_sources"],
          })
          PY

      - name: Upload market-state artifact
        if: steps.rbnz.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: market-state
          path: /tmp/market-state/market-state.json
          retention-days: 5

      - name: Refuse vendor substitute when official RBNZ is blocked
        if: steps.rbnz.outcome != 'success'
        run: |
          echo "::error::Official RBNZ B2 workbook returned HTTP 403 from GitHub-hosted runners. The generator will not substitute a vendor or media feed. Unit tests and the US/CA/AU/ECB live smoke already passed. Re-run the documented generator command from a network that can reach rbnz.govt.nz to produce the full packet."
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            exit 0
          fi
          exit 2
