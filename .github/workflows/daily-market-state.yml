name: Daily Market State

on:
  schedule:
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-market-state
  cancel-in-progress: true

jobs:
  generate:
    name: Generate market-state packet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check -r requirements-market-state.txt

      - name: Deterministic parser and calculation tests
        run: PYTHONPATH=. python -m unittest tests.test_market_state -v

      - name: Generate market-state packet
        run: |
          set -euo pipefail
          mkdir -p /tmp/market-state
          PYTHONPATH=. python scripts/market_state.py --output /tmp/market-state/market-state.json

      - name: Validate packet contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.market_state import validate_snapshot

          packet = json.loads(Path("/tmp/market-state/market-state.json").read_text())
          validate_snapshot(packet)
          assert packet["method"]["model_calls"] == 0
          assert packet["method"]["credentials_required"] == []
          assert packet["method"]["fx_source"] == "ecb_euro_reference_crosses"
          assert packet["method"]["fx_pair_count"] == 45
          assert packet["method"]["rate_rv_count"] == 15
          assert set(packet["rates"]) == {"US", "CA", "AU", "NZ"}
          assert set(packet["rates"]["US"]["tenors"]) >= {"2Y", "5Y", "10Y", "30Y"}
          assert set(packet["rates"]["CA"]["tenors"]) >= {"2Y", "5Y", "10Y", "LONG"}
          assert len(packet["fx"]["pairs"]) == 45
          assert "AUDNZD" in packet["fx"]["pairs"]
          assert "NOKSEK" in packet["fx"]["pairs"]
          assert "TWELVE_DATA" not in json.dumps(packet)
          print({
              "status": packet["status"],
              "fx_as_of": packet["fx"]["source_observation"],
              "rate_as_of": {k: v["latest_observation"] for k, v in packet["rates"].items()},
              "stale_sources": packet["stale_sources"],
              "fx_pairs": len(packet["fx"]["pairs"]),
          })
          PY

      - name: Upload market-state artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-state
          path: /tmp/market-state/market-state.json
          retention-days: 5
