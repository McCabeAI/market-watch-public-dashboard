name: Validate Sal Market Data

on:
  push:
    branches: [sal-market-data-v1]
  pull_request:
    paths:
      - 'scripts/sal_market_data.py'
      - 'scripts/run_sal_market_data.py'
      - 'tests/test_sal_market_data.py'
      - 'requirements-sal.txt'
      - 'patch_v10/**'
      - '.github/workflows/validate-sal-market-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deterministic parser dependency
        run: python -m pip install -r requirements-sal.txt
      - name: Unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Live official-source smoke test
        run: |
          mkdir -p /tmp/sal
          PYTHONPATH=. python scripts/run_sal_market_data.py --output /tmp/sal/state.json --html /tmp/sal/market.html
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('/tmp/sal/state.json').read_text())
          assert s['method']['model_calls'] == 0
          assert s['method']['fx_pair_count'] == 45
          assert s['method']['rate_rv_count'] == 15
          assert set(s['rates']) == {'US','CA','AU','NZ'}
          assert Path('/tmp/sal/market.html').stat().st_size > 1000
          print({
              'fx_as_of': s['fx']['source_observation'],
              'rate_as_of': {k:v['latest_observation'] for k,v in s['rates'].items()},
              'fx_pairs': len(s['fx']['pairs']),
              'rate_rv': len(s['rate_rv']),
          })
          PY
      - name: Upload validation snapshot
        uses: actions/upload-artifact@v4
        with:
          name: sal-market-data-validation
          path: /tmp/sal/
          retention-days: 3
