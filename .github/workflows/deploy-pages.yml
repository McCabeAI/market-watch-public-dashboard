name: Deploy Market Watch Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and validate static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat payload/part*.b64 > /tmp/dashboard.b64
          test "$(wc -c < /tmp/dashboard.b64)" -eq 33344
          base64 --decode /tmp/dashboard.b64 > /tmp/dashboard.html.gz
          gzip -t /tmp/dashboard.html.gz
          gzip -dc /tmp/dashboard.html.gz > _site/index.html
          test "$(wc -c < _site/index.html)" -eq 108092
          echo "4f0b7ea4c13c762c564c8203d1421c6e110ac3536d7ffc5bd27df5532f638676  _site/index.html" | sha256sum -c -
          grep -q "Market Watch | Public Macro Temperature Dashboard v5" _site/index.html
          grep -q "News &amp; Central Bank Research" _site/index.html
          grep -q "27 new central-bank items" _site/index.html
          grep -q '<div class="news-count">73</div>' _site/index.html
          grep -q "How Do Market Expectations React to the FOMC Dot Plot" _site/index.html
          grep -q "Exchange Rate Transmission through Multinational Firms" _site/index.html
          grep -q "Public Sources" _site/index.html
          grep -q "</html>" _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
