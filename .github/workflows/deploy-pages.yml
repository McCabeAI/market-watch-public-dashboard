name: Deploy Market Watch Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild v6 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat payload_v6/part*.b64 > /tmp/v6.b64
          test "$(wc -c < /tmp/v6.b64)" -eq 41912
          base64 --decode /tmp/v6.b64 > /tmp/v6.html.gz
          gzip -t /tmp/v6.html.gz
          gzip -dc /tmp/v6.html.gz > /tmp/v6.html
          test "$(wc -c < /tmp/v6.html)" -eq 134496
          echo "2c68341978db2ccc8efdd8f1af7bee4e105c89427f741bb10e7747cb98dde917  /tmp/v6.html" | sha256sum -c -

      - name: Apply last-24-hours patch
        shell: bash
        run: |
          set -euo pipefail
          cat patch_v7/last24_*.html > /tmp/last24.html
          python - <<'PY'
          from pathlib import Path
          base = Path('/tmp/v6.html').read_text()
          css = Path('patch_v7/last24.css').read_text()
          html = Path('/tmp/last24.html').read_text()
          anchor = '<div class="stitle">Top Market Drivers</div>'
          if '.last24{' in base or 'Last 24 Hours · Desk Summary' in base:
              raise SystemExit('v6 base already contains v7 patch')
          if base.count('</style>') < 1 or base.count(anchor) != 1:
              raise SystemExit('v6 patch anchors changed')
          out = base.replace('</style>', css + '\n</style>', 1)
          out = out.replace(anchor, '\n' + html + anchor, 1)
          Path('_site/index.html').write_text(out)
          PY
          test -s _site/index.html
          news_count="$(grep -o 'class=\"last24-item\"' _site/index.html | wc -l | tr -d '[:space:]')"
          test "$news_count" -ge 1
          test "$news_count" -le 6
          grep -Fq 'Last 24 Hours · Desk Summary' _site/index.html
          grep -Fq 'class="last24-window"' _site/index.html
          grep -Fq 'Last refreshed' _site/index.html

      - name: Apply rolling news rollup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('_site/index.html')
          base = path.read_text()
          rollup = Path('patch_v9/news_rollup.html').read_text()

          start = '<div class="stitle">Top Market Drivers</div>'
          end = '<div class="x-signal">'
          if base.count(start) != 1 or base.count(end) != 1:
              raise SystemExit('rolling-news anchors changed')
          a = base.index(start)
          b = base.index(end, a)
          out = base[:a] + rollup + base[b:]

          replacements = {
              '<b>8 SEP 2026</b>': '<b>9 SEP 2026</b>',
              'Oil near $100, global hike risk is back, Canada trade stress deepens and the yen carry unwind is live.': '$100 oil dominates rates risk; Canada trade stress and softer US household signals complicate the growth read.',
              '<b>GLOBAL · Inflation:</b> Houthi strikes on Saudi energy facilities pushed Brent to $97.92. <b>US · Jobs/Fed:</b> +162k payrolls revived September hike odds, while Waller remains the dovish counterweight. <b>Canada · Trade/Jobs:</b> retaliatory tariffs began as employment fell 41.7k. <b>Japan · FX:</b> markets price a near-certain BOJ hike and yen shorts are being cut.': '<b>GLOBAL · Inflation:</b> Brent has broken $100 as Gulf conflict intensifies. <b>US · Fed/Consumer:</b> strong August payrolls keep a hike live, but NY Fed household job and credit expectations weakened. <b>Canada · Trade/Jobs:</b> the trade conflict escalated as domestic labor data cooled. <b>China → AUD/NZD:</b> energy lifted inflation while underlying demand remained soft.',
              '<b>Last scanned:</b> 8 Sep 2026 · Sources include Reuters, ABC, AP, FT and verified public X feeds.': '<b>Last scanned:</b> 9 Sep 2026 · Sources include Reuters, ABC and official central-bank sources.',
              '<div class="news-count">19</div>': '<div class="news-count">10</div>',
              'curated market-relevant stories in the 2–8 September window, ranked by expected rates/FX significance rather than headline volume.': 'retained events in the rolling seven-day window after applying the USD/CAD/AUD/NZD relevance gate and deduplication.'
          }
          for old, new in replacements.items():
              if out.count(old) != 1:
                  raise SystemExit(f'expected one metadata anchor: {old[:60]}')
              out = out.replace(old, new, 1)

          if out.count('class="driver-card"') != 3:
              raise SystemExit('expected exactly three top drivers')
          story_count = out.count('class="story"')
          if not 1 <= story_count <= 12:
              raise SystemExit(f'invalid rolling digest count: {story_count}')
          if 'Current tape</div><div class="news-count">10</div>' not in out:
              raise SystemExit('news count metadata not refreshed')

          path.write_text(out)
          PY
          grep -Fq '<b>9 SEP 2026</b>' _site/index.html
          test "$(grep -o 'class=\"driver-card\"' _site/index.html | wc -l | tr -d '[:space:]')" -eq 3
          story_count="$(grep -o 'class=\"story\"' _site/index.html | wc -l | tr -d '[:space:]')"
          test "$story_count" -ge 1
          test "$story_count" -le 12
          grep -Fq 'Brent breaks $100 as Gulf conflict intensifies' _site/index.html
          grep -Fq '<div class="news-count">10</div>' _site/index.html

      - name: Restore 1-100 temperature input scores
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('_site/index.html')
          base = path.read_text()
          css = Path('patch_v8/temp_scores.css').read_text()
          blocks = {
              'us': Path('patch_v8/us.html').read_text(),
              'ca': Path('patch_v8/ca.html').read_text(),
              'au': Path('patch_v8/au.html').read_text(),
              'nz': Path('patch_v8/nz.html').read_text(),
          }
          anchors = {
              'us': '<div class="kpis"><div class="kpi"><div class="name">Core PCE</div><div class="num">3.3%</div></div><div class="kpi"><div class="name">Core CPI</div><div class="num">2.5%</div></div><div class="kpi"><div class="name">Payrolls</div><div class="num">+162k</div></div><div class="kpi"><div class="name">Unemployment</div><div class="num">4.1%</div></div></div>',
              'ca': '<div class="kpis"><div class="kpi"><div class="name">CPI trim</div><div class="num">1.9%</div></div><div class="kpi"><div class="name">CPI median</div><div class="num">2.0%</div></div><div class="kpi"><div class="name">Employment</div><div class="num">-42k</div></div><div class="kpi"><div class="name">Unemployment</div><div class="num">6.4%</div></div></div>',
              'au': '<div class="kpis"><div class="kpi"><div class="name">Headline CPI</div><div class="num">3.5%</div></div><div class="kpi"><div class="name">Trimmed CPI</div><div class="num">3.6%</div></div><div class="kpi"><div class="name">Unemployment</div><div class="num">4.5%</div></div><div class="kpi"><div class="name">Q2 GDP</div><div class="num">+0.4%</div></div></div>',
              'nz': '<div class="kpis"><div class="kpi"><div class="name">Headline CPI</div><div class="num">4.1%</div></div><div class="kpi"><div class="name">CPI ex fuel</div><div class="num">2.9%</div></div><div class="kpi"><div class="name">Unemployment</div><div class="num">5.6%</div></div><div class="kpi"><div class="name">OCR</div><div class="num">2.75%</div></div></div>',
          }
          old_method = 'State: Cold / Cool / Neutral / Warm / Hot. Direction: Cooling / Static / Warming. Direction carries more weight. Consumer capacity—jobs, wages, inflation and purchasing power—is the first-order lens. Prototype labels are not the canonical project baselines.'
          new_method = 'State: Cold / Cool / Neutral / Warm / Hot. The restored 1–100 interface scores map 1–20 Cold, 21–40 Cool, 41–60 Neutral, 61–80 Warm and 81–100 Hot across Inflation, Labor, Activity and Consumer inputs. Direction: Cooling / Static / Warming and carries more trading weight. The numeric scores and labels are prototype presentation, not canonical project baselines.'

          if '.temp-inputs{' in base or 'Temperature Inputs · 1–100' in base:
              raise SystemExit('v7 base already contains v8 score patch')
          if base.count('</style>') < 1:
              raise SystemExit('style anchor missing')
          for name, anchor in anchors.items():
              if base.count(anchor) != 1:
                  raise SystemExit(f'{name} KPI anchor changed')
          if base.count(old_method) != 1:
              raise SystemExit('temperature-method anchor changed')
          if base.count('<title>Market Watch | Public Macro Temperature Dashboard v6</title>') != 1:
              raise SystemExit('title anchor changed')
          old_footer = 'Market Watch public-data prototype v3 · no Bloomberg dependency · no proprietary office data'
          if base.count(old_footer) != 1:
              raise SystemExit('footer anchor changed')

          out = base.replace('</style>', css + '\n</style>', 1)
          for name, anchor in anchors.items():
              out = out.replace(anchor, anchor + '\n' + blocks[name], 1)
          out = out.replace('<title>Market Watch | Public Macro Temperature Dashboard v6</title>',
                            '<title>Market Watch | Public Macro Temperature Dashboard v8</title>', 1)
          out = out.replace(old_method, new_method, 1)
          out = out.replace(old_footer,
                            'Market Watch public-data prototype v8 · no Bloomberg dependency · no proprietary office data', 1)

          if out.count('Temperature Inputs · 1–100') != 4:
              raise SystemExit('expected four score panels')
          if out.count('/100') != 16:
              raise SystemExit('expected sixteen input scores')
          news_count = out.count('class="last24-item"')
          if not 1 <= news_count <= 6:
              raise SystemExit(f'invalid last-24-hours card count: {news_count}')
          if out.count('class="driver-card"') != 3:
              raise SystemExit('top-driver cap violated')
          if out.count('class="story"') > 12:
              raise SystemExit('rolling digest cap violated')
          for marker in ('Last 24 Hours · Desk Summary', 'Top Market Drivers', 'X Signal', 'Central Bank Research · 30-day window'):
              if marker not in out:
                  raise SystemExit(f'missing retained marker: {marker}')

          path.write_text(out)
          PY
          test -s _site/index.html
          test "$(grep -o '/100' _site/index.html | wc -l | tr -d '[:space:]')" -eq 16
          test "$(grep -o 'Temperature Inputs · 1–100' _site/index.html | wc -l | tr -d '[:space:]')" -eq 4
          grep -Fq '<title>Market Watch | Public Macro Temperature Dashboard v8</title>' _site/index.html
          grep -Fq 'Last refreshed' _site/index.html
          grep -Fq '<div class="news-count">10</div>' _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
