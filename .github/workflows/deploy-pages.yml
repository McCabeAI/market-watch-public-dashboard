name: Deploy Market Watch Dashboard

on:
  # All market-cycle stages are manual until the dependency-gated launch is installed.
  # Inputs are optional. An empty launch_id remains a manual refresh. A non-empty
  # launch_id must match the finalized launch on the dispatched commit; the build
  # fails closed when it does not. Accepting the dispatch is not publication.
  workflow_dispatch:
    inputs:
      launch_id:
        description: Finalized launch id to bind to this production deploy
        required: false
        default: ""
        type: string
      review_id:
        description: Freeze review id for launch_id
        required: false
        default: ""
        type: string
      packet_sha256:
        description: Freeze packet SHA-256 for launch_id
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "patch_v7/**"
      - "patch_v9/**"
      - "patch_v12/**"
      - "data/temperature_scores.json"
      - "data/temperature_calibration.json"
      - "data/temperature_history/**"
      - "data/score_source_registry.json"
      - "scripts/temperature_level.py"
      - "scripts/apply_temperature_scores.py"
      - "scripts/apply_daily_refresh.py"
      - "scripts/sync_news_summary.py"
      - "scripts/apply_overnight_news_refresh.py"
      - "scripts/validate_score_sources.py"
      - "scripts/activity_survey_freshness.py"
      - "scripts/macro_freshness.py"
      - "scripts/macro_source_refresh.py"
      - "scripts/harvest_nz_pci.py"
      - "scripts/harvest_ca_pmi.py"
      - "scripts/harvest_au_pmi.py"
      - "scripts/harvest_ea_pmi.py"
      - "scripts/harvest_jp_pmi.py"
      - "scripts/country_registry.py"
      - "scripts/apply_six_economy_dashboard.py"
      - "data/country_registry.json"
      - "scripts/harvest_au_pmi.py"
      - "tests/test_sync_news_summary.py"
      - "tests/test_overnight_news_refresh.py"
      - "tests/test_news_commentary_missing.py"
      - "scripts/overnight/news_commentary_state.py"
      - "tests/test_research_publishability.py"
      - "tests/test_temperature_scores.py"
      - "tests/test_temperature_level.py"
      - "tests/test_temperature_history_audit.py"
      - "tests/test_activity_survey_freshness.py"
      - "tests/test_macro_freshness.py"
      - "tests/test_harvest_nz_pci.py"
      - "tests/test_harvest_ca_pmi.py"
      - "tests/test_harvest_au_pmi.py"
      - "tests/test_harvest_ea_pmi.py"
      - "tests/test_harvest_jp_pmi.py"
      - "tests/test_country_registry.py"
      - "tests/test_six_economy_dashboard.py"
      - "tests/test_harvest_au_pmi.py"
      - "tests/fixtures/nz_pci/**"
      - "tests/fixtures/ca_pmi/**"
      - "tests/fixtures/au_pmi/**"
      - "docs/*SCORE*.md"
      - "docs/DAILY_REFRESH_V0.md"
      - "scripts/apply_market_data_tab.py"
      - "scripts/apply_trader_book_tab.py"
      - "scripts/overnight/**"
      - "scripts/overnight_pipeline.py"
      - "scripts/market_state.py"
      - "scripts/policy_path_data.py"
      - "tests/test_policy_path_data.py"
      - "scripts/official_curve_data.py"
      - "scripts/market_opportunities.py"
      - "scripts/cross_asset_data.py"
      - "tests/test_market_opportunities.py"
      - "tests/test_official_curve_data.py"
      - "patch_v13/**"
      - "patch_v14/**"
      - "scripts/apply_trader_room_tab.py"
      - "scripts/apply_dashboard_repair.py"
      - "scripts/dashboard_repair/**"
      - "tests/test_dashboard_repair.py"
      - "scripts/market_watch_launch/publication_release.py"
      - "tests/test_mw_publication_release.py"
      - "scripts/market_watch_launch/pages_recovery.py"
      - "scripts/market_watch_launch/pages.py"
      - "scripts/trader_room_public.py"
      - "scripts/pm/**"
      - "scripts/pm_layer.py"
      - "data/trader-room/public/**"
      - "data/pm/**"
      - "trader-room/runs/**"
      - "tests/test_trader_room_dashboard.py"
      - "tests/test_trader_room_publish.py"
      - "tests/test_pm_*.py"
      - "data/overnight/**"
      - "tests/test_overnight_pipeline.py"
      - "tests/test_overnight_scheduled_output.py"
      - "tests/test_overnight_acceptance_handoff.py"
      - "docs/OVERNIGHT_PIPELINE_V1.md"
      - ".github/workflows/overnight-scheduled-output.yml"
      - "requirements-market-state.txt"
      - "scripts/apply_country_detail.py"
      - "scripts/policy_state.py"
      - "scripts/country_detail/policy_rate.py"
      - "data/policy_state.json"
      - "tests/test_policy_state.py"
      - "scripts/country_detail/country_detail.css"
      - "scripts/country_detail/projection.py"
      - "scripts/country_detail/render.py"
      - "scripts/country_detail/attention.py"
      - "tests/test_country_detail_*.py"
      - "docs/COUNTRY_DETAIL_ATTENTION_V1.md"
      # Must stay after data/overnight/**. Inbox JSON is accepted elsewhere.
      - "!data/overnight/inbox/**/scheduled_output.json"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  # Pull-request previews cancel each other. Production dispatches queue in
  # pages-production (cancel-in-progress false) so a production dispatch can
  # never cancel an in-progress research publish job that shares the group.
  group: ${{ github.event_name == 'workflow_dispatch' && 'pages-production' || format('pages-preview-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      dataset_run_id: ${{ steps.dataset.outputs.dataset_run_id }}
      pages_base_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Optional render failures append one JSON line here. The file stays outside
      # _site; the issues step reads it and restamps release.json before upload.
      # The runner context is not available in job-level env, so export it here.
      - name: Set render diagnostics path
        shell: bash
        run: echo "MW_RENDER_DIAGNOSTICS=${RUNNER_TEMP}/render-diagnostics.jsonl" >> "$GITHUB_ENV"

      - name: Restore official release cache (side path)
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: .mw-cache-restore/official_release_cache.json
          key: mw-release-dates-v1-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}-${{ github.run_id }}
          restore-keys: |
            mw-release-dates-v1-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}-

      - name: Bind authorized Pages dispatch to this checkout
        id: dataset
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.launch_id != ''
        env:
          MW_LAUNCH_ID: ${{ github.event.inputs.launch_id }}
          MW_REVIEW_ID: ${{ github.event.inputs.review_id }}
          MW_PACKET_SHA256: ${{ github.event.inputs.packet_sha256 }}
          PYTHONPATH: .
        run: python3 -m scripts.market_watch_launch.pages_dispatch bind-checkout

      - name: Rebuild static base
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m scripts.market_watch_launch.research_static_base base --root . --out _site/index.html

      - name: Extend dashboard to six economies
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 scripts/apply_six_economy_dashboard.py _site/index.html

      - name: Restore 1-100 temperature input scores
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m scripts.market_watch_launch.research_static_base temperature-inputs --root . --html _site/index.html

      - name: Add August CPI context to US inflation evidence
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m scripts.market_watch_launch.render_steps run \
            --html _site/index.html \
            --label "August CPI context" \
            --optional \
            --fallback legacy_patch_skipped \
            --category render \
            --component legacy_patch \
            --phase final \
            -- python3 scripts/apply_v10_us_cpi_context.py _site/index.html

      - name: Apply Sep 14 completeness refresh
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m scripts.market_watch_launch.render_steps run \
            --html _site/index.html \
            --label "Sep 14 completeness refresh" \
            --optional \
            --fallback legacy_patch_skipped \
            --category render \
            --component legacy_patch \
            --phase final \
            -- python3 scripts/apply_v11_refresh.py _site/index.html

      - name: Apply Sep 18 legacy completeness refresh
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m scripts.market_watch_launch.render_steps run \
            --html _site/index.html \
            --label "Sep 18 legacy completeness refresh" \
            --optional \
            --fallback legacy_patch_skipped \
            --category render \
            --component legacy_patch \
            --phase final \
            -- python3 scripts/apply_daily_refresh.py _site/index.html

      - name: Apply accepted overnight news refresh
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m scripts.market_watch_launch.render_steps run \
            --html _site/index.html \
            --label "accepted news refresh" \
            --optional \
            --fallback news_unavailable \
            --category news \
            --component news \
            --phase final \
            -- bash -c 'python3 scripts/apply_overnight_news_refresh.py _site/index.html && python3 scripts/sync_news_summary.py _site/index.html'

      - name: Apply live temperature scores
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/validate_score_sources.py
          python -m pip install --disable-pip-version-check -r requirements-market-state.txt
          TMPDIR="$(mktemp -d)"
          PYTHONPATH=. python - <<PY
          from pathlib import Path
          from scripts.temperature_level import write_state, write_paths
          write_state(Path("${TMPDIR}") / "temperature_scores.json")
          write_paths(Path("${TMPDIR}") / "score_paths.json")
          PY
          cmp data/temperature_scores.json "${TMPDIR}/temperature_scores.json"
          cmp data/temperature_history/score_paths.json "${TMPDIR}/score_paths.json"
          PYTHONPATH=. python scripts/temperature_level.py --print-levels
          PYTHONPATH=. python3 -m scripts.market_watch_launch.render_steps run \
            --html _site/index.html \
            --label "temperature scores" \
            --optional \
            --fallback scores_unavailable \
            --category scores \
            --component scoreboard \
            --phase final \
            -- python3 scripts/apply_temperature_scores.py _site/index.html --print-scores

      - name: Set up Python for market-state packet
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore short-rate last-good cache (side path)
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .mw-cache-restore/short_rate_last_good.json
          key: short-rate-last-good-v1-${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            short-rate-last-good-v1-${{ github.workflow }}-${{ github.ref }}-

      - name: Restore futures basis history (side path)
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .mw-cache-restore/futures_basis_history.json
          key: futures-basis-history-v1-${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            futures-basis-history-v1-${{ github.workflow }}-${{ github.ref }}-

      - name: Restore ASX futures last-good cache (side path)
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .mw-cache-restore/asx_futures_last_good.json
          key: mw-asx-futures-v1-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}-${{ github.run_id }}
          restore-keys: |
            mw-asx-futures-v1-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}-

      - name: Generate market-state JSON for Pages
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-market-state.txt
          mkdir -p .mw-cache-restore data/cache
          RESTORED=".mw-cache-restore/asx_futures_last_good.json"
          if [ -f "$RESTORED" ]; then
            cp "$RESTORED" data/cache/asx_futures_last_good.json
            export MW_ASX_FUTURES_CACHE="data/cache/asx_futures_last_good.json"
          fi
          PYTHONPATH=. python scripts/market_state.py --output _site/market-state.json --public --short-rate-store .mw-cache-restore/short_rate_last_good.json
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from scripts.market_state import validate_snapshot
          packet = json.loads(Path("_site/market-state.json").read_text())
          validate_snapshot(packet)
          PY
          mkdir -p .mw-cache-restore
          if [ -f data/cache/asx_futures_last_good.json ]; then
            cp data/cache/asx_futures_last_good.json .mw-cache-restore/asx_futures_last_good.json
          fi

      - name: Save ASX futures last-good cache for next run
        if: success() || failure()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .mw-cache-restore/asx_futures_last_good.json
          key: mw-asx-futures-v1-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}-${{ github.run_id }}

      - name: Save short-rate last-good cache for next run
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .mw-cache-restore/short_rate_last_good.json
          key: short-rate-last-good-v1-${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}

      - name: Save futures basis history for next run
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .mw-cache-restore/futures_basis_history.json
          key: futures-basis-history-v1-${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}

      - name: Apply Country Detail
        shell: bash
        run: |
          set -euo pipefail
          if ! PYTHONPATH=. python3 scripts/policy_state.py --refresh; then
            echo "policy state refresh failed; Country Detail will use the committed artifact"
          fi
          PYTHONPATH=. python3 -m scripts.market_watch_launch.render_steps run \
            --html _site/index.html \
            --label "country detail" \
            --optional \
            --fallback country_detail_unavailable \
            --category chart \
            --component country_detail \
            --phase final \
            -- python3 scripts/apply_country_detail.py _site/index.html

      - name: Add Market Data tab
        shell: bash
        run: |
          set -euo pipefail
          node --check patch_v12/market-data.js
          PYTHONPATH=. python3 -m scripts.market_watch_launch.render_steps run \
            --html _site/index.html \
            --label "market data tab" \
            --optional \
            --category render \
            --component market_data_tab \
            --phase final \
            -- python3 scripts/apply_market_data_tab.py _site/index.html

      - name: Add Trader Book tab
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m scripts.market_watch_launch.render_steps run \
            --html _site/index.html \
            --label "trader book tab" \
            --optional \
            --category trader_books \
            --component trader_book_tab \
            --phase final \
            -- python3 scripts/apply_trader_book_tab.py _site/index.html
          REQUIRE_DATASET=()
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then REQUIRE_DATASET=(--require-dataset); fi
          PYTHONPATH=. python3 scripts/overnight_pipeline.py publish-check --site-dir _site --news-html-policy soft "${REQUIRE_DATASET[@]}"

      - name: Add Trader Room tab
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m scripts.market_watch_launch.render_steps run \
            --html _site/index.html \
            --label "trader room tab" \
            --optional \
            --category render \
            --component trader_room \
            --phase final \
            -- python3 scripts/apply_trader_room_tab.py _site/index.html
          # An unverified room packet is published as unavailable, never as authoritative.
          PYTHONPATH=. python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          out = Path("_site/trader-room.json")

          def unavailable(reason: str) -> None:
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(json.dumps({"available": False, "reason": reason}) + "\n", encoding="utf-8")
              from scripts.market_watch_launch.publication_issues import record_diagnostic
              record_diagnostic(
                  "trader_room_unavailable",
                  category="render",
                  severity="warning",
                  component="trader_room",
                  phase="final",
                  cause="The trader room packet could not be verified, so it is published as unavailable.",
                  impact="Trader Room is not shown as an authoritative debate record on this edition.",
                  detail=reason,
              )

          try:
              import subprocess
              proc = subprocess.run(
                  [sys.executable, "scripts/trader_room_public.py", "--output", str(out)],
                  check=False,
              )
              if proc.returncode != 0:
                  raise RuntimeError(f"trader_room_public.py exited {proc.returncode}")
              packet = json.loads(out.read_text(encoding="utf-8"))
              from scripts.trader_room_public import (
                  assert_published_trader_room,
                  build_public_packet,
                  select_newest_complete_run,
              )
              selected = select_newest_complete_run()
              expected = build_public_packet()
              if selected is None:
                  raise RuntimeError("no complete valid canonical Trader Room run")
              if packet.get("available") is not True:
                  raise RuntimeError("trader room packet is not available")
              if packet.get("run_id") != selected.name or packet.get("run_id") != expected.get("run_id"):
                  raise RuntimeError("trader room run_id does not match the selected run")
              if packet.get("run_id") != (packet.get("selection") or {}).get("selected_run_id"):
                  raise RuntimeError("trader room selection does not match run_id")
              assert_published_trader_room(packet, selected)
              selection = packet.get("selection") or {}
              if selection.get("manual_pointer") is not False or selection.get("mode") != "newest_complete_valid":
                  raise RuntimeError("trader room selection is not the newest complete valid run")
          except Exception as exc:
              unavailable(f"{type(exc).__name__}: {exc}")
          PY

      - name: Add Portfolio Manager public JSON
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/pm_layer.py publish --site-dir _site
          test -s _site/pm-books.json
          PYTHONPATH=. python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.pm.public import validate_public_packet
          packet = json.loads(Path("_site/pm-books.json").read_text())
          validate_public_packet(packet)
          PY

      - name: Apply dashboard repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pypdf==6.0.0'
          RESTORED=".mw-cache-restore/official_release_cache.json"
          TARGET="data/dashboard_repair/official_release_cache.json"
          if [[ -f "$RESTORED" ]]; then
            python - <<'PY'
          import json
          import pathlib
          import sys

          restored = pathlib.Path(".mw-cache-restore/official_release_cache.json")
          target = pathlib.Path("data/dashboard_repair/official_release_cache.json")
          try:
              obj = json.loads(restored.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              sys.exit(0)
          if not isinstance(obj, dict) or obj.get("version") != 1:
              sys.exit(0)
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(obj, indent=2) + "\n", encoding="utf-8")
          PY
          else
            echo "No cache artifact at $RESTORED; keeping committed seed."
          fi
          MARKET=()
          if [ -s _site/market-state.json ]; then
            MARKET=(--market-state _site/market-state.json)
          fi
          PYTHONPATH=. python3 scripts/apply_dashboard_repair.py _site/index.html "${MARKET[@]}" --fetch-schedules --schedule-timeout 6

      - name: Save official release cache for next run
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .mw-cache-restore
          cp data/dashboard_repair/official_release_cache.json .mw-cache-restore/official_release_cache.json

      - name: Write official release cache to Actions cache
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@v4
        with:
          path: .mw-cache-restore/official_release_cache.json
          key: mw-release-dates-v1-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}-${{ github.run_id }}

      - name: Stamp final publication edition
        env:
          MW_LAUNCH_ID: ${{ github.event.inputs.launch_id }}
          MW_REVIEW_ID: ${{ github.event.inputs.review_id }}
          MW_PACKET_SHA256: ${{ github.event.inputs.packet_sha256 }}
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python3 -m scripts.market_watch_launch.publication_release stamp-final --site-dir _site
          test -s _site/release.json
          grep -Fq 'data-publication-phase="final"' _site/index.html

      - name: Check final publication integrity
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python3 -m scripts.market_watch_launch.publication_checks final --site-dir _site --root .

      - name: Publish issues feed
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python3 -m scripts.market_watch_launch.publication_issues publish --site-dir _site --root .

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Production only: refuse to replace a newer public or committed edition
      # (for example a manual refresh of an older dataset over today's research
      # edition). A finalized launch outranks its own research edition.
      - name: Refuse to publish over a newer edition
        if: github.event_name == 'workflow_dispatch'
        env:
          PYTHONPATH: .
          PUBLIC_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 -m scripts.market_watch_launch.publication_release guard --site-dir _site --public-base-url "$PUBLIC_BASE_URL"

      - name: Upload publication release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: publication-release-${{ github.run_attempt }}
          path: _site/release.json
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout publication verifier
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6

      - name: Checkout fresh main for publication order
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: main
          path: _publication_main

      - name: Download publication release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: publication-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication

      # The whole production run holds pages-production, so this guard on fresh
      # main sees every research receipt committed by an earlier holder.
      - name: Recheck publication order before deploy
        if: github.event_name == 'workflow_dispatch'
        env:
          PYTHONPATH: .
          PUBLIC_BASE_URL: ${{ needs.build.outputs.pages_base_url }}
        run: python3 -m scripts.market_watch_launch.publication_release guard --site-dir "${RUNNER_TEMP}/publication" --root _publication_main --public-base-url "$PUBLIC_BASE_URL"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Verify public page serves this dataset
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.launch_id != ''
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DATASET_RUN_ID: ${{ needs.build.outputs.dataset_run_id }}
          PYTHONPATH: .
        run: python3 -m scripts.market_watch_launch.pages_dispatch verify-public

      # Observability of the edition label. The dataset check above remains the
      # Stage 08 publication contract, so this read-back does not gate it.
      - name: Report public publication edition
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.launch_id != ''
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PYTHONPATH: .
        run: |
          python3 -m scripts.market_watch_launch.publication_release verify-public \
            --release "${RUNNER_TEMP}/publication/release.json" \
            --page-url "$PAGE_URL"

  reconcile:
    name: Reconcile Stage 08 for this deploy
    # GITHUB_TOKEN-dispatched runs do not start reconcile-published-pages.yml
    # through workflow_run, so the launch-bound production run records its own
    # Stage 08 once its deploy job (deploy + dataset read-back) succeeded.
    needs: [build, deploy]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.launch_id != '' &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Record this run's successful deploy as Stage 08
        env:
          PYTHONPATH: .
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          LAUNCH_ID: ${{ github.event.inputs.launch_id }}
        run: |
          set -euo pipefail
          run_json="${RUNNER_TEMP}/pages-run.json"
          python3 -m scripts.market_watch_launch.pages_recovery in-run-evidence --deploy-result "$DEPLOY_RESULT" --out "$run_json"
          RUN_ID="$GITHUB_RUN_ID" PAGES_RUN_JSON="$run_json" GH_REPO="$GITHUB_REPOSITORY" \
            bash scripts/market_watch_launch/reconcile_published_pages.sh
