name: Deploy Market Watch Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          set +e
          base64 --decode dashboard.html.gz.b64 | gzip -dc > _site/index.html
          gzip_status=$?
          set -e
          test -s _site/index.html
          grep -q "MARKET WATCH | MACRO TEMPERATURE" _site/index.html
          grep -q "</html>" _site/index.html
          echo "gzip exit status: $gzip_status (non-zero is tolerated only because the stored payload has a trailer checksum mismatch; HTML integrity checks above must pass)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
