name: Deploy Market Watch Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and validate static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          test "$(wc -c < payload/v7/dashboard.html.gz)" -eq 33100
          echo "309503e113b5c2568f7b911ac54e4a8d270d48b31b67933e540672100a289527  payload/v7/dashboard.html.gz" | sha256sum -c -
          gzip -t payload/v7/dashboard.html.gz
          gzip -dc payload/v7/dashboard.html.gz > _site/index.html
          test "$(wc -c < _site/index.html)" -eq 141174
          echo "c0c7e973e23b04ada07baac7636fa4fb0e424c0e0d5def2e4ff5305f718f7952  _site/index.html" | sha256sum -c -

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
