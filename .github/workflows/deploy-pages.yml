name: Deploy Market Watch Dashboard

on:
  push:
    branches: [main]
    paths-ignore:
      # Intermediate overnight ledger commits must not publish before the scheduled morning release.
      - "data/overnight/runs/**"
      - "data/overnight/latest.json"
      - "data/overnight/books/**"
      - "data/overnight/README.md"
  schedule:
    - cron: "15 4 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "patch_v7/**"
      - "patch_v9/**"
      - "patch_v12/**"
      - "data/temperature_scores.json"
      - "data/score_source_registry.json"
      - "scripts/apply_temperature_scores.py"
      - "scripts/apply_daily_refresh.py"
      - "scripts/sync_news_summary.py"
      - "scripts/validate_score_sources.py"
      - "tests/test_sync_news_summary.py"
      - "tests/test_temperature_scores.py"
      - "docs/*SCORE*.md"
      - "docs/DAILY_REFRESH_V0.md"
      - "scripts/apply_market_data_tab.py"
      - "scripts/apply_trader_book_tab.py"
      - "scripts/overnight/**"
      - "scripts/overnight_pipeline.py"
      - "scripts/market_state.py"
      - "scripts/policy_path_data.py"
      - "tests/test_policy_path_data.py"
      - "scripts/official_curve_data.py"
      - "scripts/market_opportunities.py"
      - "scripts/cross_asset_data.py"
      - "tests/test_market_opportunities.py"
      - "tests/test_official_curve_data.py"
      - "patch_v13/**"
      - "patch_v14/**"
      - "scripts/apply_trader_room_tab.py"
      - "scripts/trader_room_public.py"
      - "scripts/pm_layer.py"
      - "scripts/pm_review.py"
      - "data/pm/**"
      - "tests/test_pm_layer.py"
      - ".github/workflows/pm-decision-output.yml"
      - ".github/workflows/trader-room-output.yml"
      - "data/trader-room/public/**"
      - "tests/test_trader_room_dashboard.py"
      - "data/overnight/**"
      - "tests/test_overnight_pipeline.py"
      - "tests/test_overnight_scheduled_output.py"
      - "docs/OVERNIGHT_PIPELINE_V1.md"
      - ".github/workflows/overnight-scheduled-output.yml"
      - "requirements-market-state.txt"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild v6 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat payload_v6/part*.b64 > /tmp/v6.b64
          test "$(wc -c < /tmp/v6.b64)" -eq 41912
          base64 --decode /tmp/v6.b64 > /tmp/v6.html.gz
          gzip -t /tmp/v6.html.gz
          gzip -dc /tmp/v6.html.gz > /tmp/v6.html
          test "$(wc -c < /tmp/v6.html)" -eq 134496
          echo "2c68341978db2ccc8efdd8f1af7bee4e105c89427f741bb10e7747cb98dde917  /tmp/v6.html" | sha256sum -c -

      - name: Apply last-24-hours patch
        shell: bash
        run: |
          set -euo pipefail
          cat patch_v7/last24_*.html > /tmp/last24.html
          python - <<'PY'
          from pathlib import Path
          base = Path('/tmp/v6.html').read_text()
          css = Path('patch_v7/last24.css').read_text()
          html = Path('/tmp/last24.html').read_text()
          anchor = '<div class="stitle">Top Market Drivers</div>'
          if '.last24{' in base or 'Last 24 Hours · Desk Summary' in base:
              raise SystemExit('v6 base already contains v7 patch')
          if base.count('</style>') < 1 or base.count(anchor) != 1:
              raise SystemExit('v6 patch anchors changed')
          out = base.replace('</style>', css + '\n</style>', 1)
          out = out.replace(anchor, '\n' + html + anchor, 1)
          Path('_site/index.html').write_text(out)
          PY
          test -s _site/index.html
          news_count="$(grep -o 'class=\"last24-item\"' _site/index.html | wc -l | tr -d '[:space:]')"
          test "$news_count" -ge 1
          test "$news_count" -le 6
          grep -Fq 'Last 24 Hours · Desk Summary' _site/index.html
          grep -Fq 'class="last24-window"' _site/index.html
          grep -Fq 'Last refreshed' _site/index.html

      - name: Apply rolling news rollup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('_site/index.html')
          base = path.read_text()
          rollup = Path('patch_v9/news_rollup.html').read_text()
          start = '<div class="stitle">Top Market Drivers</div>'
          end = '<div class="x-signal">'
          if base.count(start) != 1 or base.count(end) != 1:
              raise SystemExit('rolling-news anchors changed')
          a = base.index(start)
          b = base.index(end, a)
          out = base[:a] + rollup + base[b:]
          if out.count('class="driver-card"') > 3 or out.count('class="driver-card"') < 1:
              raise SystemExit('invalid top-driver count')
          story_count = out.count('class="story"')
          if not 1 <= story_count <= 12:
              raise SystemExit(f'invalid rolling digest count: {story_count}')
          if '<div class="stitle">7-Day Quick Digest</div>' not in rollup or '<div class="scanline"><b>Window:</b>' not in rollup:
              raise SystemExit('rolling digest metadata missing')
          path.write_text(out)
          PY
          driver_count="$(grep -o 'class=\"driver-card\"' _site/index.html | wc -l | tr -d '[:space:]')"
          test "$driver_count" -ge 1
          test "$driver_count" -le 3
          story_count="$(grep -o 'class=\"story\"' _site/index.html | wc -l | tr -d '[:space:]')"
          test "$story_count" -ge 1
          test "$story_count" -le 12
          grep -Fq '7-Day Quick Digest' _site/index.html

      - name: Restore 1-100 temperature input scores
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('_site/index.html')
          base = path.read_text()
          css = Path('patch_v8/temp_scores.css').read_text()
          blocks = {'us': Path('patch_v8/us.html').read_text(), 'ca': Path('patch_v8/ca.html').read_text(), 'au': Path('patch_v8/au.html').read_text(), 'nz': Path('patch_v8/nz.html').read_text()}
          anchors = {'us': '<div class="cdetail us">', 'ca': '<div class="cdetail ca">', 'au': '<div class="cdetail au">', 'nz': '<div class="cdetail nz">'}
          if '.temp-inputs{' in base or 'class="temp-dimension"' in base:
              raise SystemExit('temperature score patch already present')
          if base.count('</style>') < 1:
              raise SystemExit('temperature score CSS anchor changed')
          out = base.replace('</style>', css + '\n</style>', 1)
          for key, anchor in anchors.items():
              if out.count(anchor) != 1:
                  raise SystemExit(f'{key} country anchor changed')
              out = out.replace(anchor, anchor + '\n' + blocks[key], 1)
          Path('_site/index.html').write_text(out)
          PY
          test "$(grep -o 'class="temp-dimension' _site/index.html | wc -l | tr -d '[:space:]')" -eq 16
          test "$(grep -o 'Hard score inputs' _site/index.html | wc -l | tr -d '[:space:]')" -eq 16
          test "$(grep -o 'class="evidence-block context"' _site/index.html | wc -l | tr -d '[:space:]')" -eq 16

      - name: Add August CPI context to US inflation evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_v10_us_cpi_context.py _site/index.html

      - name: Apply Sep 14 completeness refresh
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_v11_refresh.py _site/index.html

      - name: Apply Sep 18 completeness refresh
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_daily_refresh.py _site/index.html

      - name: Sync news summary metadata
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m unittest tests.test_sync_news_summary
          PYTHONPATH=. python scripts/sync_news_summary.py _site/index.html

      - name: Apply live temperature scores
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/validate_score_sources.py
          PYTHONPATH=. python -m unittest tests.test_temperature_scores
          PYTHONPATH=. python scripts/apply_temperature_scores.py _site/index.html --print-scores
          test "$(grep -o 'Reindexed to 50 on 2026-09-17' _site/index.html | wc -l | tr -d '[:space:]')" -eq 16
          test "$(grep -o 'data-score-overview="live"' _site/index.html | wc -l | tr -d '[:space:]')" -eq 1
          grep -Fq 'Live 1–100 Score Board' _site/index.html
          if grep -Fq '>Temperature Board<' _site/index.html; then echo "stale top-level Temperature Board label remains"; exit 1; fi
          if grep -Fq 'transition anchor' _site/index.html; then echo "stale transition-anchor language remains in built dashboard"; exit 1; fi

      - name: Set up Python for market-state packet
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate market-state JSON for Pages
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-market-state.txt
          PYTHONPATH=. python scripts/market_state.py --output _site/market-state.json --public
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from scripts.market_state import validate_snapshot
          packet = json.loads(Path("_site/market-state.json").read_text())
          validate_snapshot(packet)
          PY

      - name: Add Market Data tab
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m unittest tests.test_market_opportunities -v
          node --check patch_v12/market-data.js
          python scripts/apply_market_data_tab.py _site/index.html
          test -s _site/market-data.js
          grep -Fq 'for="p-marketdata"' _site/index.html
          grep -Fq 'Market Data · official snapshot' _site/index.html
          if [ -s _site/market-state.json ]; then echo "Pages will include the live market-state packet"; else echo "Pages will ship the Market Data tab without a packet; the client shows an explicit load failure"; fi

      - name: Validate overnight contracts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m unittest tests.test_overnight_pipeline tests.test_overnight_scheduled_output tests.test_pm_layer

      - name: Add Trader Book tab
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_trader_book_tab.py _site/index.html
          REQUIRE_DATASET=()
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then REQUIRE_DATASET=(--require-dataset); fi
          PYTHONPATH=. python scripts/overnight_pipeline.py publish-check --site-dir _site "${REQUIRE_DATASET[@]}"
          test -s _site/trader-book.js
          test -s _site/trader-books.json
          grep -Fq 'for="p-traderbook"' _site/index.html
          grep -Fq 'Trader Book · paper P&L' _site/index.html
          grep -Fq 'Portfolio managers · $1bn each' _site/trader-book.js
          grep -Fq 'Last 24 Hours · Desk Summary' _site/index.html
          grep -Fq 'Live 1–100 Score Board' _site/index.html
          grep -Fq '7-Day Quick Digest' _site/index.html
          grep -Fq 'Market Data · official snapshot' _site/index.html

      - name: Add Trader Room tab
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m unittest tests.test_trader_room_dashboard -v
          python scripts/apply_trader_room_tab.py _site/index.html
          PYTHONPATH=. python scripts/trader_room_public.py --output _site/trader-room.json
          test -s _site/trader-room.js
          test -s _site/trader-room.json
          python - <<'PY'
          import json
          p=json.load(open('_site/trader-room.json'))
          assert p.get('available') is True
          assert p.get('seat_count') == 14
          PY
          grep -Fq 'for="p-traderroom"' _site/index.html
          grep -Fq 'Trader Room · adversarial ideas' _site/index.html
          grep -Fq 'Trader Book · paper P&L' _site/index.html
          grep -Fq 'Market Data · official snapshot' _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
