name: Deploy Market Watch Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and validate static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat payload/part*.b64 > /tmp/dashboard.b64
          echo "B64_BYTES=$(wc -c < /tmp/dashboard.b64)"
          test "$(wc -c < /tmp/dashboard.b64)" -eq 33344
          base64 --decode /tmp/dashboard.b64 > /tmp/dashboard.html.gz
          echo "GZIP_BYTES=$(wc -c < /tmp/dashboard.html.gz)"
          gzip -t /tmp/dashboard.html.gz
          echo "GZIP_OK"
          gzip -dc /tmp/dashboard.html.gz > _site/index.html
          echo "HTML_BYTES=$(wc -c < _site/index.html)"
          echo "HTML_SHA=$(sha256sum _site/index.html | cut -d' ' -f1)"
          test "$(wc -c < _site/index.html)" -eq 108092
          echo "4f0b7ea4c13c762c564c8203d1421c6e110ac3536d7ffc5bd27df5532f638676  _site/index.html" | sha256sum -c -
          markers=(
            "Market Watch | Public Macro Temperature Dashboard v5"
            "News &amp; Central Bank Research"
            "27 new central-bank items"
            '<div class="news-count">73</div>'
            "How Do Market Expectations React to the FOMC Dot Plot"
            "Exchange Rate Transmission through Multinational Firms"
            "Public Sources"
            "</html>"
          )
          for marker in "${markers[@]}"; do
            grep -Fq "$marker" _site/index.html
            echo "FOUND: $marker"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
