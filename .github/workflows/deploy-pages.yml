name: Deploy Market Watch Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and validate static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat payload_v6/part*.b64 > /tmp/dashboard.b64
          test "$(wc -c < /tmp/dashboard.b64)" -eq 41912
          base64 --decode /tmp/dashboard.b64 > /tmp/dashboard.html.gz
          test "$(wc -c < /tmp/dashboard.html.gz)" -eq 31432
          gzip -t /tmp/dashboard.html.gz
          gzip -dc /tmp/dashboard.html.gz > _site/index.html
          test "$(wc -c < _site/index.html)" -eq 134496
          echo "2c68341978db2ccc8efdd8f1af7bee4e105c89427f741bb10e7747cb98dde917  _site/index.html" | sha256sum -c -
          grep -Fq 'Market Watch | Public Macro Temperature Dashboard v6' _site/index.html
          grep -Fq 'Market News · 7-day window' _site/index.html
          grep -Fq 'Central Bank Research · 30-day window' _site/index.html
          grep -Fq 'Saudi energy attacks send Brent to $97.92' _site/index.html
          grep -Fq 'RBNZ confirms the 25bp OCR hike to 2.75%' _site/index.html
          grep -Fq 'X Signal' _site/index.html
          grep -Fq '</html>' _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
