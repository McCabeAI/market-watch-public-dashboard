name: Overnight Deterministic Pipeline

on:
  schedule:
    # Keep the six logical stage clocks, but treat every scheduled event as a
    # reconciliation wake-up. Additional wake-ups provide catch-up capacity
    # when GitHub delays or drops one exact cron delivery.
    - cron: "7 0 * * 1-5"
      timezone: "America/New_York"
    - cron: "27,47 0 * * 1-5"
      timezone: "America/New_York"
    - cron: "7,27 1 * * 1-5"
      timezone: "America/New_York"
    - cron: "40 1 * * 1-5"
      timezone: "America/New_York"
    - cron: "50 1 * * 1-5"
      timezone: "America/New_York"
    - cron: "55 1 * * 1-5"
      timezone: "America/New_York"
    - cron: "0 2 * * 1-5"
      timezone: "America/New_York"
    - cron: "35 3 * * 1-5"
      timezone: "America/New_York"
    - cron: "45 3 * * 1-5"
      timezone: "America/New_York"
    - cron: "50 3 * * 1-5"
      timezone: "America/New_York"
    - cron: "55 3 * * 1-5"
      timezone: "America/New_York"
    - cron: "7 4 * * 1-5"
      timezone: "America/New_York"
    - cron: "17 4 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run validates every deterministic stage with zero model calls"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, live-stage]
      stage:
        description: "Deterministic stage for live-stage mode"
        required: false
        default: collect
        type: choice
        options:
          - collect
          - pre_trader_delta
          - freeze_evidence
          - final_delta
          - assemble
          - publish
      as_of:
        description: "Optional ISO timestamp"
        required: false
        type: string
  pull_request:
    paths:
      - ".cursor/hooks.json"
      - ".cursor/hooks/enforce-subagent-models.sh"
      - ".cursor/hooks/enforce-overnight-budget.py"
      - ".cursor/hooks/enforce-overnight-runtime.py"
      - "scripts/overnight/**"
      - "scripts/macro_freshness.py"
      - "scripts/macro_source_refresh.py"
      - "tests/test_macro_freshness.py"
      - "scripts/pm/**"
      - "scripts/overnight_pipeline.py"
      - ".cursor/commands/overnight-scheduled.md"
      - "tests/test_pm_scheduled_output.py"
      - "tests/test_pm_overnight_packets.py"
      - "tests/test_trading_memory.py"
      - "scripts/apply_trader_book_tab.py"
      - "patch_v13/**"
      - "data/overnight/**"
      - "tests/test_overnight_pipeline.py"
      - "tests/test_overnight_scheduled_output.py"
      - "tests/test_overnight_acceptance_handoff.py"
      - "tests/test_overnight_review_identity.py"
      - "docs/OVERNIGHT_PIPELINE_V1.md"
      - ".github/workflows/overnight-pipeline.yml"
      - ".github/workflows/overnight-scheduled-output.yml"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: write

concurrency:
  # Serialize production schedule/manual runs, but do not let delayed production
  # wake-ups cancel or starve pull-request validation runs.
  group: overnight-deterministic-pipeline-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'schedule'
    name: Overnight contracts and dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m unittest tests.test_macro_freshness tests.test_overnight_pipeline tests.test_overnight_scheduled_output tests.test_overnight_acceptance_handoff tests.test_overnight_review_identity tests.test_pm_scheduled_output tests.test_pm_overnight_packets tests.test_trading_memory tests.test_trader_room_dashboard -v
      - name: End-to-end zero-model dry-run
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 scripts/overnight_pipeline.py schedule
          PYTHONPATH=. python3 scripts/overnight_pipeline.py dry-run --suffix ci --site-dir /tmp/overnight-site
          test -s /tmp/overnight-site/trader-books.json
          test -s /tmp/overnight-site/pm-books.json

  scheduled-reconcile:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Check operator recovery hold
        id: recovery_hold
        run: |
          if [ -f data/overnight/RECOVERY_HOLD ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "Operator recovery hold is active; scheduled reconciliation is intentionally paused."
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.recovery_hold.outputs.active != 'true'
        with:
          python-version: "3.12"
      - name: Install market-state dependencies
        if: steps.recovery_hold.outputs.active != 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-market-state.txt
      - name: Reconcile all due deterministic stages
        if: steps.recovery_hold.outputs.active != 'true'
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 scripts/overnight_pipeline.py reconcile --live-market-state
      - name: Persist reconciled deterministic state to main
        if: steps.recovery_hold.outputs.active != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/overnight
          git add data/pm/books data/pm/review_packets data/pm/public data/pm/data_requests 2>/dev/null || true
          git add data/temperature_history/macro_source_audit.json data/temperature_scores.json data/temperature_history/score_paths.json data/temperature_history/us.json data/temperature_history/ca.json data/temperature_history/au.json data/temperature_history/nz.json data/temperature_history/ea.json data/temperature_history/jp.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No deterministic overnight state changes"
            exit 0
          fi
          git commit -m "chore: reconcile overnight deterministic stages"
          # Live market-state generation may update tracked cache/source files that
          # are intentionally outside the overnight persistence boundary. Discard
          # those runner-local side effects before rebasing the committed state.
          git restore --worktree -- .
          git clean -fd
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
          git pull --rebase origin main
          git push origin HEAD:main

  resolve-manual:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live-stage'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.resolve.outputs.stage }}
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: resolve
        env:
          STAGE: ${{ inputs.stage }}
          AS_OF: ${{ inputs.as_of }}
        run: |
          set -euo pipefail
          if [ -n "$AS_OF" ]; then
            RUN_ID="$(PYTHONPATH=. python3 scripts/overnight_pipeline.py run-id --as-of "$AS_OF")"
          else
            RUN_ID="$(PYTHONPATH=. python3 scripts/overnight_pipeline.py run-id)"
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

  run-manual-stage:
    if: needs.resolve-manual.result == 'success'
    needs: [validate, resolve-manual]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install market-state dependencies
        if: contains(fromJSON('["collect","pre_trader_delta","final_delta"]'), needs.resolve-manual.outputs.stage)
        run: python -m pip install --disable-pip-version-check -r requirements-market-state.txt
      - name: Run deterministic stage
        env:
          STAGE: ${{ needs.resolve-manual.outputs.stage }}
          RUN_ID: ${{ needs.resolve-manual.outputs.run_id }}
          AS_OF: ${{ inputs.as_of }}
        run: |
          set -euo pipefail
          AS_OF_ARGS=()
          if [ -n "$AS_OF" ]; then AS_OF_ARGS=(--as-of "$AS_OF"); fi
          case "$STAGE" in
            collect|pre_trader_delta|final_delta)
              PYTHONPATH=. python3 scripts/overnight_pipeline.py stage "$STAGE" \
                --run-id "$RUN_ID" --live-market-state "${AS_OF_ARGS[@]}"
              ;;
            publish)
              PYTHONPATH=. python3 scripts/overnight_pipeline.py stage publish \
                --run-id "$RUN_ID" --require-dataset "${AS_OF_ARGS[@]}"
              ;;
            *)
              PYTHONPATH=. python3 scripts/overnight_pipeline.py stage "$STAGE" \
                --run-id "$RUN_ID" "${AS_OF_ARGS[@]}"
              ;;
          esac
      - name: Persist deterministic state to main
        env:
          STAGE: ${{ needs.resolve-manual.outputs.stage }}
          RUN_ID: ${{ needs.resolve-manual.outputs.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/overnight
          git add data/pm/books data/pm/review_packets data/pm/public data/pm/data_requests 2>/dev/null || true
          git add data/temperature_history/macro_source_audit.json data/temperature_scores.json data/temperature_history/score_paths.json data/temperature_history/us.json data/temperature_history/ca.json data/temperature_history/au.json data/temperature_history/nz.json data/temperature_history/ea.json data/temperature_history/jp.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No deterministic overnight state changes"
            exit 0
          fi
          git commit -m "chore: overnight $STAGE $RUN_ID"
          # Persist only the explicitly staged overnight/PM state. Live collection
          # can leave unrelated tracked cache/source updates in the worktree.
          git restore --worktree -- .
          git clean -fd
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
          git pull --rebase origin main
          git push origin HEAD:main
