name: Recover accepted finalization

on:
  workflow_dispatch:
    inputs:
      launch_id:
        description: Accepted launch whose Stage 07 commit never reached main
        required: true
        default: mwl-20261002T094056Z-1d0ebea5
        type: string
      run_id:
        description: Overnight run id of the immutable scheduled output
        required: true
        default: overnight-20261002
        type: string

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Replay finalization without provider or model calls
        env:
          LAUNCH_ID: ${{ inputs.launch_id }}
          RUN_ID: ${{ inputs.run_id }}
        run: bash scripts/market_watch_launch/recover_accepted_finalization.sh
